    },
    {
      level: 19, name: '会話', sample: '몇 시예요? 뭐 했어요?', pairs: true,
      note: '質問に、数と形をそろえて答えます。몇は「いくつ」、뭐は「何」、어제は昨日、내일は明日、날씨は天気です。',
      cards: [['何時ですか', '지금 몇 시예요?'], ['何歳ですか', '몇 살이에요?'], ['昨日、何をしましたか', '어제 뭐 했어요?'], ['明日、何をするつもりですか', '내일 뭐 할 거예요?']],
      hero: [['何時ですか', '몇 시예요?'], ['何をしましたか', '뭐 했어요?']],
      specs: levelNineteenSpecs,
    },
  ];

  // ホームのレベル一覧の区切り。ここから文を作るレベルになる
  const FIRST_SENTENCE = LESSONS.findIndex(lesson => lesson.level === 11);
  const PARTS = [
    { name: '数を覚える', lessons: LESSONS.slice(0, FIRST_SENTENCE) },
    { name: '文で話す', lessons: LESSONS.slice(FIRST_SENTENCE) },
  ];

  const LEVEL_COUNT = LESSONS.filter(lesson => lesson.level).length;
  const SHOP_COUNT = LESSONS.filter(lesson => lesson.shop).length;
  LESSONS.forEach(lesson => { lesson.id = lesson.shop ? `shop${lesson.shop}` : `lv${lesson.level}`; });

  const lessonById = id => LESSONS.find(lesson => lesson.id === id);
  const lessonOfLevel = level => LESSONS.find(lesson => lesson.level === level);
  const lessonTitle = lesson => (lesson.shop ? lesson.name : `Lv.${lesson.level} ${lesson.name}`);

  /* ━━ 7. 音声（Web Speech API） ━━ */

  const speech = (() => {
    const synth = window.speechSynthesis || null;
    // iPhoneの韓国語の声は速さの幅が狭い。実機で 0.9 が0.95秒、0.6 が1.03秒、0.1 が1.44秒だったので、いちばん遅くする
    const SLOW_RATE = /iPhone|iPad/.test(navigator.userAgent) ? .1 : .6;
    let voice = null;
    let current = null;
    let watchdog = 0;
    let primed = false;

    // iPhoneは押した瞬間に一度読み上げ機能を使うと、少し後からの読み上げも許可される
    function prime() {
      if (!synth || primed) return;
      primed = true;
      const silent = new SpeechSynthesisUtterance('');
      silent.volume = 0;
      synth.speak(silent);
    }

    function refresh() {
      if (!synth) return;
      const voices = synth.getVoices();
      voice = voices.find(v => /^ko[-_]KR$/i.test(v.lang)) || voices.find(v => /^ko\b/i.test(v.lang)) || null;
    }

    function stop() {
      clearTimeout(watchdog);
      current = null;
      if (synth && (synth.speaking || synth.pending)) synth.cancel();
    }

    function speak(text, { slow = false, onStart, onEnd, onFail } = {}) {
      stop();
      if (!synth) { if (onFail) onFail(); return; }
      if (synth.paused) synth.resume();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = slow ? SLOW_RATE : .9;
      if (voice) utterance.voice = voice;
      const mine = fn => (...args) => { if (current === utterance && fn) fn(...args); };
      utterance.onstart = mine(() => { clearTimeout(watchdog); if (onStart) onStart(); });
      utterance.onend = mine(() => { clearTimeout(watchdog); if (onEnd) onEnd(); });
      utterance.onerror = mine(event => {
        clearTimeout(watchdog);
        const stopped = event.error === 'canceled' || event.error === 'interrupted'; // 再生し直しただけ
        if (stopped && onEnd) onEnd();
        if (!stopped && onFail) onFail();
      });
      current = utterance;
      synth.speak(utterance);
      watchdog = setTimeout(mine(onFail), 3000); // 無音のまま止まる端末があるため
    }

    if (synth) {
      refresh();
      if (synth.addEventListener) synth.addEventListener('voiceschanged', refresh);
    }
    return { speak, stop, prime, refresh, supported: Boolean(synth), hasVoice: () => Boolean(voice) };
  })();

  /* ━━ 8. 保存（localStorage） ━━
     ブラウザの中の小さな保存場所。使えない環境でも、その場では普通に遊べるようにする。 */

  const STORE_KEY = 'korean-number-quiz';
  const HISTORY_SIZE = 30;
  const ATTACK_SECONDS = 60;
  const READ_DELAY = 420;      // 答えてから単語を読み上げるまでの時間（ミリ秒）
  const MODE_NAME = { attack: 'タイムアタック', review: '復習' };
  // レベル制にする前の記録の表示名。記録は残すので読めるようにしておく
  const OLD_MODE_NAME = { read: '読み方', listen: '聞き取り', attack: 'タイムアタック', counter: '助数詞', konbini: 'コンビニ', review: '復習' };
  const OLD_SYS_NAME = { native: '固有数詞', sino: '漢数詞', mix: '場面ミックス' };

  const store = (() => {
    const fresh = () => ({
      review: {},
      sound: true,
      speak: true,
      // placed：始める場所を決めたか。cleared：合格したレベルの数（レベルは順に開く）
      // shops：コンビニ回ごとの最高正解数。遊んだ回、飛ばした回だけが入る
      course: { placed: false, cleared: 0, shops: {} },
      best: {},
      history: [],
      streak: { days: 0, best: 0, last: '' },
      totals: { answered: 0, correct: 0, bestCombo: 0 },
    });
    const isRecord = value => Boolean(value) && typeof value === 'object' && !Array.isArray(value);
    const count = value => (Number.isFinite(value) && value >= 0 ? value : 0);
    const isOldRound = ({ mode, sys, level }) => Boolean(OLD_MODE_NAME[mode] && OLD_SYS_NAME[sys]) && [1, 2, 3].includes(level);
    const withinRange = (value, max) => Number.isInteger(value) && value >= 1 && value <= max;
    const isRound = ({ mode, sys, level }) => {
      if (sys) return false;
      if (mode === 'lesson') return withinRange(level, LEVEL_COUNT);
      if (mode === 'shop') return withinRange(level, SHOP_COUNT);
      return Boolean(MODE_NAME[mode]);
    };
    const isEntry = entry => isRecord(entry) && (isRound(entry) || isOldRound(entry))
      && [entry.score, entry.at, entry.correct, entry.total].every(Number.isFinite);

    // 保存データの形が想定と違う項目は捨てて、その項目だけ最初の状態に戻す
    function read() {
      const data = fresh();
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch { /* 読めないときは最初の状態で始める */ }
      if (!isRecord(saved)) return data;
      if (saved.sound === false) data.sound = false;
      // 以前は効果音と読み上げが同じ設定だったので、読み上げの設定がなければ効果音に合わせる
      data.speak = typeof saved.speak === 'boolean' ? saved.speak : data.sound;
      if (isRecord(saved.review)) data.review = saved.review;
      if (isRecord(saved.best)) {
        data.best = Object.fromEntries(Object.entries(saved.best).filter(([, entry]) => isEntry(entry)));
      }
      if (Array.isArray(saved.history)) data.history = saved.history.filter(isEntry).slice(0, HISTORY_SIZE);
      if (isRecord(saved.course)) {
        const { placed, cleared, shops } = saved.course;
        data.course.placed = placed === true;
        if (Number.isInteger(cleared) && cleared >= 0 && cleared <= LEVEL_COUNT) data.course.cleared = cleared;
        if (isRecord(shops)) {
          data.course.shops = Object.fromEntries(Object.entries(shops).filter(([shop, correct]) =>
            withinRange(Number(shop), SHOP_COUNT) && Number.isInteger(correct) && correct >= 0 && correct <= ROUND_SIZE));
        }
      }
      if (isRecord(saved.streak)) {
        data.streak = { days: count(saved.streak.days), best: count(saved.streak.best), last: String(saved.streak.last || '') };
      }
      if (isRecord(saved.totals)) {
        for (const key of Object.keys(data.totals)) data.totals[key] = count(saved.totals[key]);
      }
      return data;
    }

    const self = {
      data: read(),
      save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(self.data)); } catch { /* 保存できなくても続ける */ }
      },
      reset() {
        self.data = fresh();
        self.save();
      },
    };
    return self;
  })();

  function canBuild(spec) {
    try {
      return !/undefined|NaN/.test(build(spec).word);
    } catch {
      return false;
    }
  }

  function cleanReview() {
    for (const [key, entry] of Object.entries(store.data.review)) {
      if (!entry || !canBuild(entry.spec)) delete store.data.review[key];
    }
  }

  function addMistake(q) {
    const before = store.data.review[q.key];
    store.data.review[q.key] = { spec: q.spec, misses: (before ? before.misses : 0) + 1, at: Date.now() };
  }

  const reviewCount = () => Object.keys(store.data.review).length;

  function reviewSpecs() {
    const newest = Object.values(store.data.review).sort((a, b) => b.at - a.at).slice(0, ROUND_SIZE);
    return shuffle(newest.map(entry => entry.spec));
  }

  const dayKey = date => `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;

  function yesterdayKey() {
    const date = new Date();
    date.setDate(date.getDate() - 1);
    return dayKey(date);
  }

  // ストリーク：1問でも答えた日が何日続いているか
  function touchStreak() {
    const { streak } = store.data;
    const today = dayKey(new Date());
    if (streak.last === today) return;
    streak.days = streak.last === yesterdayKey() ? streak.days + 1 : 1;
    streak.last = today;
    streak.best = Math.max(streak.best, streak.days);
  }

  function currentStreak() {
    const { days, last } = store.data.streak;
    return last === dayKey(new Date()) || last === yesterdayKey() ? days : 0;
  }

  // 連続で正解するほど1問の点が増える（200点で頭打ち）
  const pointsFor = combo => 100 + 10 * Math.min(combo - 1, 10);

  function bestKey({ mode, lesson }) {
    if (mode === 'review') return null;
    return lesson ? lesson.id : mode;
  }

  function roundLabel({ mode, sys, level }) {
    if (sys) {
      if (mode === 'review' || mode === 'konbini') return OLD_MODE_NAME[mode];
      if (mode === 'counter') return `${OLD_MODE_NAME.counter} Lv.${level}`;
      return `${OLD_MODE_NAME[mode]} ${OLD_SYS_NAME[sys]} Lv.${level}`;
    }
    if (mode === 'lesson') return lessonTitle(lessonOfLevel(level));
    if (mode === 'shop') return lessonTitle(lessonById(`shop${level}`));
    return MODE_NAME[mode];
  }

  const course = () => store.data.course;
  const isOpen = lesson => (lesson.shop ? lesson.shop * SHOP_EVERY <= course().cleared : lesson.level <= course().cleared + 1);
  const isPassed = lesson => (lesson.shop ? (course().shops[lesson.shop] ?? 0) >= PASS_SCORE : lesson.level <= course().cleared);

  // 続きから始める場所。今のレベルのすぐ前に、まだ遊んでいないコンビニ回があれば先に案内する
  function nextLesson() {
    const level = lessonOfLevel(Math.min(course().cleared + 1, LEVEL_COUNT));
    const before = LESSONS[LESSONS.indexOf(level) - 1];
    const shopWaiting = before && before.shop && isOpen(before) && course().shops[before.shop] === undefined;
    return shopWaiting ? before : level;
  }

  // タイムアタックは開いたレベルから出す。音を待つ時間がないので読む問題だけ
  function attackSpecs() {
    const specs = LESSONS.filter(lesson => lesson.level && isOpen(lesson)).flatMap(lesson => lesson.specs());
    return shuffle(specs.map(({ listen, ...spec }) => spec));
  }

  /* ━━ 効果音（Web Audio API） ━━
     音声ファイルは使わず、その場で音を合成する。圏外でも鳴る。 */

  const sound = (() => {
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319]; // 5音音階。コンボで1段ずつ上がる
    let engine = null;

    // iPhoneに音の扱いを伝える。ambient は「流れている音楽と重ねて鳴らす」。対応していない端末では何もしない
    function setSession(type) {
      try {
        if (navigator.audioSession) navigator.audioSession.type = type;
      } catch { /* 指定できなくても音は鳴らす */ }
    }
    setSession('ambient');

    // iPhoneは別のアプリから戻ると音が出なくなることがあるので、次に鳴らすときに作り直す
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || !engine || !navigator.audioSession) return;
      const old = engine;
      engine = null;
      setSession('auto');
      Promise.resolve().then(() => old.close()).catch(() => {}).then(() => setSession('ambient'));
    });

    function tone(audio, { shape, from, to = from, at = 0, length, volume }) {
      const start = audio.currentTime + at;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = shape;
      osc.frequency.setValueAtTime(from, start);
      if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, start + length);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(.001, start + length);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start(start);
      osc.stop(start + length + .01);
    }

    const draw = {
      // コツッ：木に軽く触れたような短い音
      tap(audio) {
        tone(audio, { shape: 'sine', from: 900, to: 500, length: .03, volume: .14 });
      },
      right(audio, combo = 1) {
        const step = Math.min(combo - 1, SCALE.length - 1);
        tone(audio, { shape: 'triangle', from: SCALE[step], length: .1, volume: .26 });
        tone(audio, { shape: 'sine', from: SCALE[step] * 1.5, at: .085, length: .26, volume: .3 });
      },
      // コトッ：木をたたいたような低く短い音
      wrong(audio) {
        tone(audio, { shape: 'sine', from: 190, to: 120, length: .1, volume: .5 });
        tone(audio, { shape: 'triangle', from: 420, to: 220, length: .05, volume: .14 });
      },
    };

    function play(name, combo) {
      if (!AudioEngine || !store.data.sound) return;
      try {
        if (!engine) {
          setSession('ambient');
          engine = new AudioEngine();
        }
        if (engine.state !== 'running') Promise.resolve(engine.resume()).catch(() => {});
        draw[name](engine, combo);
      } catch { /* 音が出せなくてもクイズは続ける */ }
    }

    return { play, draw };
  })();

  /* ━━ 9. 画面 ━━ */

  const $ = id => document.getElementById(id);
  const screens = {
    welcome: $('welcome'), placement: $('placement'), placed: $('placed'),
    start: $('start'), lesson: $('lesson'), quiz: $('quiz'), result: $('result'), records: $('records'),
  };
  const options = [...document.querySelectorAll('.option')];
  const testChoices = [...document.querySelectorAll('.choice')];
  const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const el = {
    counter: $('counter'), track: $('track'), question: $('question'), prompt: $('prompt'), stage: $('stage'),
    glyph: $('glyph'), gloss: $('gloss'), reveal: $('reveal'), next: $('next'), say: $('say'),
    listen: $('listen'), play: $('play'), listenNote: $('listen-note'), voiceNote: $('voice-note'),
    receipt: $('receipt'), combo: $('combo'), timer: $('timer'), timerBar: $('timer-bar'), burst: $('burst'),
  };

  cleanReview();
  let round = null;
  let openedLesson = null;

  /* 画面の動き：進むと次の画面が奥から現れ、戻ると今の画面が奥へ下がる。
     画面そのものはすぐ切り替えて押せる状態にし、前の画面の写しを後ろに残して消していく */
  const MOVE_TIME = 480;
  const MOVE_EASE = 'cubic-bezier(.22, .8, .24, 1)';
  const main = document.querySelector('main');
  let opened = false;
  let moving = null;

  function copyOf(screen, fixed) {
    const page = screen.cloneNode(true);
    if (fixed) page.querySelectorAll(fixed).forEach(node => { node.style.visibility = 'hidden'; });
    page.removeAttribute('id');
    page.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    page.style.marginTop = `${-window.scrollY}px`;
    const copy = make('div', 'leaving');
    copy.setAttribute('aria-hidden', 'true');
    copy.inert = true;
    copy.append(page);
    document.body.append(copy);
    return copy;
  }

  function stopMove() {
    if (!moving) return;
    moving.animations.forEach(animation => animation.cancel());
    moving.copy.remove();
    moving.parts.forEach(part => { part.style.transformOrigin = ''; });
    delete main.dataset.moving;
    moving = null;
  }

  function playMove(copy, parts, back) {
    const [enter, leave] = back ? [1.05, .93] : [.93, 1.05];
    const animations = parts.map(part => part.animate(
      [{ opacity: 0, transform: `scale(${enter})` }, { opacity: 1, transform: 'none' }],
      { duration: MOVE_TIME, easing: MOVE_EASE },
    ));
    animations.push(copy.animate(
      [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `scale(${leave})` }],
      { duration: MOVE_TIME * .7, easing: MOVE_EASE, fill: 'forwards' },
    ));
    const move = { copy, parts, animations };
    moving = move;
    Promise.all(animations.map(animation => animation.finished))
      .then(() => { if (moving === move) stopMove(); })
      .catch(() => { /* 途中で次の画面へ移ったときは、そちらに任せる */ });
  }

  function show(name) {
    const from = Object.values(screens).find(screen => !screen.hidden);
    const moves = opened && from && from !== screens[name] && !calmMotion.matches;
    if (moves) stopMove();
    const copy = moves ? copyOf(from) : null;
    for (const [key, screen] of Object.entries(screens)) screen.hidden = key !== name;
    window.scrollTo(0, 0);
    if (moves) {
      main.dataset.moving = '';
      playMove(copy, [main], name === 'start' || name === 'welcome');
    }
  }

  // 問題の送り：fixed の部分は動かさず、parts をひとかたまりとして同じ動きをさせる
  function changeInside(screen, fixed, parts, render) {
    if (calmMotion.matches) {
      render();
      return;
    }
    stopMove();
    const copy = copyOf(screen, fixed);
    render();
    const boxes = parts.map(part => part.getBoundingClientRect());
    const x = (Math.min(...boxes.map(box => box.left)) + Math.max(...boxes.map(box => box.right))) / 2;
    const y = (Math.min(...boxes.map(box => box.top)) + Math.max(...boxes.map(box => box.bottom))) / 2;
    copy.style.transformOrigin = `${x}px ${y}px`;
    parts.forEach((part, i) => { part.style.transformOrigin = `${x - boxes[i].left}px ${y - boxes[i].top}px`; });
    playMove(copy, parts, false);
  }

  function make(tag, className, text, lang) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    if (lang) node.lang = lang;
    return node;
  }

  const SHOP_HINT = 'レジの流れで10問';

  // 語が長いレベルは、見出しの文字を小さくして折り返しを防ぐ
  const LONG_HERO = 5;

  function renderHero(hero, lesson) {
    const words = lesson.hero || lesson.cards.slice(0, 3);
    hero.toggleAttribute('data-long', words.reduce((sum, [, word]) => sum + textWidth(word), 0) > LONG_HERO);
    hero.replaceChildren(...words.map(([label, word]) => {
      const box = make('div', 'hero-word');
      box.append(make('span', 'digit', label), make('span', '', word, 'ko'));
      return box;
    }));
  }

  function chevron() {
    const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('class', 'icon chevron');
    const shape = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    shape.setAttribute('href', '#i-chevron');
    icon.append(shape);
    return icon;
  }

  function lessonRow(lesson, current) {
    const passed = isPassed(lesson);
    const row = make('button', lesson === current ? 'mode now' : 'mode');
    row.dataset.lesson = lesson.id;
    row.disabled = !isOpen(lesson);
    const text = make('span', 'mode-text');
    text.append(make('b', '', lessonTitle(lesson)), make('span', 'mode-sub', lesson.sample, lesson.shop ? undefined : 'ko'));
    const icon = passed
      ? make('span', 'mode-icon level-icon passed', '✓')
      : lesson.shop
        ? make('span', 'mode-icon t-yellow', '원', 'ko')
        : make('span', 'mode-icon level-icon', String(lesson.level));
    row.append(icon, text, chevron());
    return row;
  }

  function renderCourse() {
    const current = nextLesson();
    const allPassed = isPassed(current);
    const hint = current.shop ? SHOP_HINT : `10問中${PASS_SCORE}問正解で次のレベルへ`;
    $('continue-name').textContent = `${allPassed ? 'もう一度' : '続きから'}：${lessonTitle(current)}`;
    $('continue-sub').textContent = allPassed ? '全レベル合格です。おめでとうございます' : hint;
    $('lessons').replaceChildren(...PARTS.map(part => partBlock(part, current)));
  }

  // 自分で開け閉めした区切りは、ホームに戻っても同じ状態にしておく
  const partOpen = {};

  function partBlock(part, current) {
    const block = make('details', 'part');
    block.open = partOpen[part.name] ?? part.lessons.includes(current);
    const levels = part.lessons.filter(lesson => lesson.level);
    const name = make('summary', 'part-name');
    name.append(
      make('span', '', part.name),
      make('span', 'mode-sub', `${levels.filter(isPassed).length} / ${levels.length}`),
      chevron(),
    );
    name.addEventListener('click', () => { partOpen[part.name] = !block.open; });
    const list = make('div', 'modes');
    list.append(...part.lessons.map(lesson => lessonRow(lesson, current)));
    block.append(name, list);
    return block;
  }

  function openLesson(lesson) {
    openedLesson = lesson;
    $('lesson-name').textContent = lessonTitle(lesson);
    $('lesson-note').textContent = lesson.note;
    $('lesson-sub').textContent = lesson.shop ? SHOP_HINT : '読む問題と聞く問題で10問';
    $('card-note').hidden = true;
    $('cards').classList.toggle('wide', Boolean(lesson.shop));
    $('cards').classList.toggle('pairs', Boolean(lesson.pairs));
    $('cards').replaceChildren(...lesson.cards.map(([label, word]) => {
      const card = make('button', 'card');
      card.dataset.say = word;
      card.append(make('span', 'digit', label), make('span', '', word, 'ko'));
      return card;
    }));
    show('lesson');
  }

  function sayCard(card) {
    const stopGlow = () => delete card.dataset.on;
    $('cards').querySelectorAll('[data-on]').forEach(other => delete other.dataset.on);
    card.dataset.on = '';
    speech.speak(card.dataset.say, {
      onEnd: stopGlow,
      onFail() {
        stopGlow();
        $('card-note').hidden = false;
      },
    });
  }

  /* 理解度テスト：易しいレベルから2問ずつ出し、2問とも正解なら次のレベルへ進む。
     間違えるか「わからない」を押した時点で終わり、そのレベルから始める。正解は見せない。 */

  const test = { level: 1, step: 0, specs: [], q: null };
  const QUESTIONS_PER_TEST_LEVEL = 2;
  const testSpecs = level => sample(lessonOfLevel(level).specs().filter(spec => !spec.listen), QUESTIONS_PER_TEST_LEVEL);

  function startTest() {
    Object.assign(test, { level: 1, step: 0, specs: testSpecs(1) });
    showTestQuestion();
    show('placement');
  }

  function showTestQuestion() {
    const q = build(test.specs[test.step]);
    test.q = q;
    $('test-step').textContent = `理解度テスト Lv.${test.level}`;
    $('test-prompt').textContent = q.prompt;
    $('test-word').textContent = q.show.text;
    $('test-word').lang = q.show.lang;
    $('test-word').style.setProperty('--len', textWidth(q.show.text));
    $('test-gloss').textContent = q.gloss || '';
    $('test-gloss').hidden = !q.gloss;
    $('test-choices').toggleAttribute('data-wide', q.choices.some(choice => textWidth(choice.text) > 5.5));
    testChoices.forEach((button, i) => {
      button.textContent = q.choices[i].text;
      button.lang = q.choices[i].lang;
    });
  }

  function answerTest(correct) {
    if (!correct) {
      finishTest(test.level);
      return;
    }
    test.step += 1;
    if (test.step === QUESTIONS_PER_TEST_LEVEL) {
      test.level += 1;
      test.step = 0;
      // 最後のレベルは総合なので、その手前まで解ければそこから始める
      if (test.level === LEVEL_COUNT) {
        finishTest(LEVEL_COUNT);
        return;
      }
      test.specs = testSpecs(test.level);
    }
    changeInside(screens.placement, '.test-top, #test-skip', [$('test-card'), $('test-choices')], showTestQuestion);
  }

  function finishTest(start) {
    const before = course().cleared;
    const firstTime = !course().placed;
    const lesson = lessonOfLevel(start);
    course().placed = true;
    course().cleared = Math.max(before, start - 1);
    // 飛ばした分のコンビニ回は開いたままにして、続きからの案内には出さない
    for (const shop of LESSONS.filter(other => other.shop && isOpen(other))) {
      course().shops[shop.shop] ??= 0;
    }
    store.save();

    const ahead = before >= start;
    renderHero($('placed-hero'), lesson);
    $('placed-title').textContent = ahead ? `Lv.${start} の力があります` : `Lv.${start} から始めましょう`;
    $('placed-note').textContent = ahead
      ? `今はLv.${nextLesson().level}まで進んでいます。進み具合はそのままです。`
      : start === 1 ? '最初の5つから順に進めましょう。' : `Lv.${start - 1}までは合格にしました。あとから戻って練習できます。`;
    $('placed-name').textContent = `${lessonTitle(lesson)}へ`;
    $('placed-go').onclick = () => openLesson(lesson);
    $('placed-restart').hidden = !firstTime || start === 1;
    show('placed');
  }

  function renderReview() {
    const count = reviewCount();
    $('review-mode').disabled = count === 0;
    $('review-sub').textContent = count ? `間違えた${count}問` : 'まだありません';
  }

  function renderSoundSetting() {
    const { sound: effects, speak } = store.data;
    $('sound-toggle').setAttribute('aria-pressed', String(effects));
    $('sound-sub').textContent = effects ? 'オン' : 'オフ';
    $('speak-toggle').setAttribute('aria-pressed', String(speak));
    $('speak-sub').textContent = speak ? 'オン' : 'オフ（ボタンを押すと読みます）';
  }

  function renderHomeRecord() {
    $('record-line').textContent = `ストリーク ${currentStreak()}日、最高 ${store.data.totals.bestCombo}コンボ`;
  }

  function renderHome() {
    renderHero($('hero'), nextLesson());
    renderCourse();
    renderReview();
    renderHomeRecord();
    renderSoundSetting();
  }

  function statBox(label, value, sub) {
    const box = make('div', 'stat');
    box.append(make('span', 'label', label), make('span', 'value', value));
    if (sub) box.append(make('span', 'sub', sub));
    return box;
  }

  function recordRow(entry, withDate) {
    const row = make('li');
    const name = make('span', '', roundLabel(entry));
    if (withDate) {
      const when = new Date(entry.at);
      const clock = `${when.getHours()}:${String(when.getMinutes()).padStart(2, '0')}`;
      name.append(make('small', '', `${when.getMonth() + 1}/${when.getDate()} ${clock}、${entry.total}問中${entry.correct}問正解`));
    }
    row.append(name, make('b', '', `${fmt(entry.score)}点`));
    return row;
  }

  function fillRows(list, rows, emptyText) {
    list.replaceChildren(...(rows.length ? rows : [make('li', 'empty', emptyText)]));
  }

  function renderRecords() {
    const { totals, streak, best, history } = store.data;
    const rate = totals.answered ? Math.round(totals.correct / totals.answered * 100) : 0;
    $('record-stats').replaceChildren(
      statBox('ストリーク', `${currentStreak()}日`, `最長${streak.best}日`),
      statBox('正解数', `${fmt(totals.correct)}問`, `正答率${rate}%`),
      statBox('最高コンボ', String(totals.bestCombo), '連続正解の数'),
    );
    const bests = Object.values(best).sort((a, b) => b.score - a.score);
    fillRows($('best-list'), bests.map(entry => recordRow(entry, false)), 'まだ記録がありません。1回遊ぶとここに残ります。');
    fillRows($('history-list'), history.slice(0, 10).map(entry => recordRow(entry, true)), 'まだ記録がありません。');
  }

  // 苦手な問題を調べられるように、保存している学習の記録を文字にする
  function studyText() {
    const { course: progress, totals, streak, best, history, review } = store.data;
    const missed = Object.values(review)
      .sort((a, b) => b.misses - a.misses)
      .map(({ spec, misses, at }) => {
        const q = build(spec);
        return { pair: q.pair, listen: q.listen, misses, at: new Date(at).toISOString().slice(0, 10) };
      });
    return JSON.stringify({ progress, totals, streak, best, history, missed });
  }

  async function copyStudyData() {
    const button = $('export');
    const box = $('export-text');
    box.value = studyText();
    try {
      await navigator.clipboard.writeText(box.value);
      button.textContent = 'コピーしました';
      box.hidden = true;
    } catch {
      // コピーできない環境では、文字を選んで手で写せるようにする
      button.textContent = '下の文字を全部選んでコピーしてください';
      box.hidden = false;
      box.select();
    }
  }

  function resetExport() {
    $('export').textContent = '学習データをコピー';
    $('export-text').hidden = true;
  }

  function disarmErase() {
    const erase = $('erase');
    delete erase.dataset.armed;
    erase.textContent = '記録とレベルをすべて消す';
  }

  function renderReceipt({ lines, total }, answered) {
    const rows = lines.map(({ good, qty }) => {
      const row = make('p', 'line');
      const name = make('span', 'name');
      name.append(make('span', 'ko', good.ko, 'ko'), make('span', 'ja', good.ja));
      row.append(name, make('span', 'qty', `${fmt(good.price)} × ${qty}`), make('span', 'sub', fmt(good.price * qty)));
      return row;
    });
    const sum = make('p', 'line sum');
    sum.append(make('span', 'name', '合計'), make('span', 'sub', answered ? `${fmt(total)}ウォン` : '？'));
    el.receipt.replaceChildren(...rows, sum);
  }

  function voiceHelp() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad/.test(ua)) return '韓国語の音声が見つかりません。設定の「読み上げコンテンツ」で韓国語の声を追加すると聞き取りが使えます。';
    if (/Android/.test(ua)) return '韓国語の音声が見つかりません。端末の設定の「テキスト読み上げ」で韓国語の音声データを追加すると聞き取りが使えます。';
    return '韓国語の音声が見つかりません。端末の言語設定で韓国語の音声を追加すると聞き取りが使えます。聞き取りは「文字で見る」でも進められます。';
  }

  function updateVoiceNote() {
    speech.refresh();
    el.voiceNote.hidden = speech.hasVoice();
    el.voiceNote.textContent = speech.hasVoice() ? '' : voiceHelp();
  }

  function stopTimers() {
    if (!round) return;
    clearInterval(round.ticker);
    clearTimeout(round.autoNext);
    clearTimeout(round.readTimer);
  }

  function tick() {
    const left = Math.max(0, round.deadline - performance.now());
    el.counter.textContent = `${Math.ceil(left / 1000)}秒`;
    el.timerBar.style.transform = `scaleX(${left / (ATTACK_SECONDS * 1000)})`;
    el.timerBar.toggleAttribute('data-low', left < 10000);
    if (left <= 0) showResult();
  }

  function startRound(specs, mode, lesson = null) {
    stopTimers();
    const timed = mode === 'attack';
    round = {
      specs, mode, timed, lesson,
      index: 0, results: [], answered: false, q: null,
      combo: 0, bestCombo: 0, score: 0, deadline: 0, ticker: 0, autoNext: 0, readTimer: 0,
    };
    el.track.hidden = timed;
    el.timer.hidden = !timed;
    el.track.replaceChildren(...(timed ? [] : specs).map(() => make('span', 'bit')));
    renderCombo();
    show('quiz');
    showQuestion();
    if (timed) {
      round.deadline = performance.now() + ATTACK_SECONDS * 1000;
      tick();
      round.ticker = setInterval(tick, 200);
    }
  }

  const playLesson = lesson => startRound(lesson.specs(), lesson.shop ? 'shop' : 'lesson', lesson);

  function renderCombo() {
    el.combo.hidden = round.combo < 2;
    el.combo.textContent = `${round.combo}コンボ`;
  }

  // 正解した選択肢から小さな丸が広がる。コンボが続くほど数が増える
  function celebrate(button, combo) {
    if (calmMotion.matches || !button.animate) return;
    const box = button.getBoundingClientRect();
    const fromX = box.left + box.width / 2;
    const fromY = box.top + box.height / 2;
    for (let i = 0, count = Math.min(8 + combo * 2, 24); i < count; i++) {
      const piece = make('i', `fly ${pickOne(['', 'blue', 'gold'])}`);
      piece.style.setProperty('--size', `${6 + Math.random() * 7}px`);
      el.burst.append(piece);
      const angle = -Math.PI / 2 + (Math.random() - .5) * 1.8;
      const reach = 70 + Math.random() * (110 + combo * 12);
      const toX = fromX + Math.cos(angle) * reach;
      const toY = fromY + Math.sin(angle) * reach;
      const spin = (Math.random() - .5) * 540;
      const duration = 600 + Math.random() * 250;
      piece.animate([
        { transform: `translate(${fromX}px, ${fromY}px) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${toX}px, ${toY}px) rotate(${spin}deg)`, opacity: 1, offset: .7 },
        { transform: `translate(${toX}px, ${toY + 36}px) rotate(${spin * 1.2}deg)`, opacity: 0 },
      ], { duration, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'forwards' });
      setTimeout(() => piece.remove(), duration + 50);
    }
    if (combo >= 2) el.combo.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' });
  }

  // 全角1、半角0.62、空白0.35文字として、見出しの幅を見積もる
  const textWidth = text => [...text].reduce((sum, ch) => sum + (ch === ' ' ? .35 : ch < '\u0080' ? .62 : 1.02), 0);

  function setGlyph(text, lang) {
    el.glyph.textContent = text;
    el.glyph.lang = lang;
    el.glyph.style.setProperty('--len', textWidth(text));
    el.glyph.hidden = false;
  }

  function playQuestion(slow = false) {
    const { q } = round;
    el.play.dataset.on = '';
    speech.speak(q.say, {
      slow,
      onStart() { el.listenNote.hidden = true; },
      onEnd() { delete el.play.dataset.on; },
      onFail() {
        delete el.play.dataset.on;
        el.listenNote.textContent = speech.supported
          ? '音声が再生できませんでした。「文字で見る」で続けられます。'
          : 'この端末は読み上げに対応していません。「文字で見る」で続けられます。';
        el.listenNote.hidden = false;
      },
    });
  }

  function showQuestion() {
    const q = build(round.specs[round.index]);
    round.q = q;
    round.answered = false;

    if (!round.timed) {
      el.counter.textContent = `${round.index + 1} / ${round.specs.length}`;
      el.track.children[round.index].dataset.state = 'now';
    }
    el.prompt.textContent = q.prompt;
    el.prompt.classList.remove('verdict');
    el.reveal.replaceChildren();
    el.say.hidden = true;
    delete el.play.dataset.on;
    delete el.question.dataset.verdict;

    el.stage.classList.toggle('listening', q.listen);
    el.listen.hidden = !q.listen;
    el.listen.classList.remove('peeked');
    el.listenNote.hidden = true;
    el.gloss.hidden = !q.gloss;
    el.gloss.textContent = q.gloss || '';
    if (q.show) setGlyph(q.show.text, q.show.lang);
    else el.glyph.hidden = true;
    el.receipt.hidden = !q.receipt;
    if (q.receipt) renderReceipt(q.receipt, false);

    screens.quiz.dataset.shape = q.choices.some(c => textWidth(c.text) > 4.2) ? 'wide' : 'short';
    options.forEach((button, i) => {
      const choice = q.choices[i];
      button.textContent = choice.text;
      button.lang = choice.lang;
      button.disabled = false;
      delete button.dataset.state;
      delete button.dataset.hit;
    });
    el.next.disabled = true;
    el.next.textContent = '';
    options[0].focus({ preventScroll: true });
    if (q.listen && store.data.speak) playQuestion();
  }

  function answer(i) {
    if (!round || round.answered) return;
    round.answered = true;

    const { q } = round;
    const correct = q.choices[i].right;
    round.results.push({ q, correct });

    round.combo = correct ? round.combo + 1 : 0;
    round.bestCombo = Math.max(round.bestCombo, round.combo);
    if (correct) round.score += pointsFor(round.combo);
    sound.play(correct ? 'right' : 'wrong', round.combo);

    const { totals } = store.data;
    totals.answered += 1;
    if (correct) totals.correct += 1;
    totals.bestCombo = Math.max(totals.bestCombo, round.combo);
    touchStreak();
    if (!correct) addMistake(q);
    else if (round.mode === 'review') delete store.data.review[q.key];
    store.save();

    options.forEach((button, j) => {
      button.disabled = true;
      button.dataset.state = q.choices[j].right ? 'correct' : j === i ? 'wrong' : 'rest';
    });
    if (!round.timed) el.track.children[round.index].dataset.state = correct ? 'done' : 'miss';

    el.prompt.replaceChildren(
      correct ? '○ ' : '× ',
      make('span', '', correct ? '정답!' : '오답', 'ko'),
      !correct ? ' 不正解' : round.combo >= 2 ? ` ${round.combo}コンボ` : ' 正解',
    );
    el.prompt.classList.add('verdict');
    el.question.dataset.verdict = correct ? 'right' : 'wrong';
    renderCombo();
    if (correct) {
      options[i].dataset.hit = '';
      celebrate(options[i], round.combo);
    }
    el.listen.hidden = true;
    el.gloss.hidden = true;
    if (q.listen) { el.stage.classList.remove('listening'); setGlyph(q.word, 'ko'); }
    if (q.show && q.show.text.includes('□')) setGlyph(q.word, 'ko');
    if (q.receipt) renderReceipt(q.receipt, true);
    el.reveal.replaceChildren(make('p', 'pair', q.pair), make('p', 'how', q.how.text, q.how.lang));
    el.say.hidden = false;

    const last = !round.timed && round.index === round.specs.length - 1;
    el.next.textContent = last ? '結果を見る' : '次の問題';
    el.next.disabled = false;
    el.next.focus({ preventScroll: true });
    if (round.timed) {
      round.autoNext = setTimeout(advance, correct ? 500 : 1400);
    } else if (store.data.speak) {
      // 効果音が鳴り終わってから単語を読む
      speech.prime();
      round.readTimer = setTimeout(() => speech.speak(q.say), READ_DELAY);
    }
  }

  function advance() {
    clearTimeout(round.autoNext);
    clearTimeout(round.readTimer);
    speech.stop();
    round.index += 1;
    if (round.timed && round.index >= round.specs.length) round.specs.push(...attackSpecs());
    if (round.index < round.specs.length) {
      changeInside(screens.quiz, '.bar', [el.question, options[0].parentElement, el.next], showQuestion);
    } else {
      showResult();
    }
  }

  // 1回分の結果を保存し、レベルの解放と自己ベストを判定する
  function recordRound() {
    const { mode, lesson, results, score, bestCombo } = round;
    const key = bestKey(round);
    const outcome = { best: 0, newBest: false, passed: false, opened: [], allPassed: false };
    if (results.length) {
      const correct = results.filter(r => r.correct).length;
      const entry = { at: Date.now(), mode, correct, total: results.length, score, combo: bestCombo };
      if (lesson) entry.level = lesson.shop || lesson.level;
      store.data.history = [entry, ...store.data.history].slice(0, HISTORY_SIZE);

      if (key) {
        const before = store.data.best[key];
        outcome.newBest = Boolean(before) && score > before.score;
        if (!before || score > before.score) store.data.best[key] = entry;
        outcome.best = store.data.best[key].score;
      }

      const finished = Boolean(lesson) && results.length === ROUND_SIZE;
      outcome.passed = finished && correct >= PASS_SCORE;
      if (finished && lesson.shop) {
        course().shops[lesson.shop] = Math.max(course().shops[lesson.shop] ?? 0, correct);
      }
      if (outcome.passed && lesson.level === course().cleared + 1) {
        const wasOpen = LESSONS.filter(isOpen);
        course().cleared = lesson.level;
        outcome.opened = LESSONS.filter(other => isOpen(other) && !wasOpen.includes(other));
        outcome.allPassed = lesson.level === LEVEL_COUNT;
      }
      store.save();
    } else if (key && store.data.best[key]) {
      outcome.best = store.data.best[key].score;
    }
    return outcome;
  }

  function cheerFor(rate) {
    if (rate === 1) return ['완벽해요!', '完璧です'];
    if (rate >= .8) return ['잘했어요!', 'よくできました'];
    if (rate >= .5) return ['좋아요!', 'いい調子です'];
    return ['다시 해 봐요!', 'もう一度やってみましょう'];
  }

  function showResult() {
    stopTimers();
    speech.stop();
    const { results, mode, lesson, timed, score, bestCombo } = round;
    const outcome = recordRound();
    const wrong = results.filter(r => !r.correct).map(r => r.q.spec);
    const right = results.length - wrong.length;

    $('score').textContent = timed ? `${fmt(score)}点` : `${right} / ${results.length}`;
    $('score').setAttribute('aria-label', timed ? `${fmt(score)}点、${right}問正解` : `${results.length}問中${right}問正解`);
    const remaining = reviewCount();
    const isReview = mode === 'review';
    const notes = [];
    if (isReview) notes.push(remaining ? `あと${remaining}問残っています。正解した問題は復習リストから消えました。` : '復習リストが空になりました。');
    else if (timed) notes.push(`${ATTACK_SECONDS}秒で${right}問正解しました。`);
    else {
      if (outcome.passed) notes.push('合格です。');
      else notes.push(`${PASS_SCORE}問正解で合格です。あと${PASS_SCORE - right}問でした。`);
      notes.push(wrong.length ? '間違えた問題は復習リストに保存しました。' : '全問正解です。');
    }
    if (outcome.newBest) notes.push('自己ベストを更新しました。');
    if (outcome.opened.length) notes.push(`${outcome.opened.map(lessonTitle).join('と')} が開きました。`);
    if (outcome.allPassed) notes.push('全レベル合格です。おめでとうございます。');
    $('score-note').textContent = notes.join('');

    const cheer = $('cheer');
    cheer.hidden = !results.length;
    if (results.length) {
      const [ko, ja] = cheerFor(right / results.length);
      cheer.replaceChildren(make('span', '', ko, 'ko'), ` ${ja}`);
    }

    $('stats').replaceChildren(
      statBox('スコア', fmt(score)),
      statBox('最大コンボ', String(bestCombo)),
      ...(isReview ? [] : [statBox('自己ベスト', outcome.best ? fmt(outcome.best) : 'なし')]),
    );

    // 間違えた問題を先に見せる。タイムアタックは問題数が多いので12問まで
    const ordered = [...results.filter(r => !r.correct), ...results.filter(r => r.correct)];
    const shown = timed ? ordered.slice(0, 12) : ordered;
    $('scraps').replaceChildren(...shown.map(r => {
      const scrap = make('li', r.correct ? 'scrap' : 'scrap missed');
      scrap.append(make('span', 'word', r.q.word, 'ko'), make('span', 'num', r.q.note));
      return scrap;
    }));

    const goNext = $('go-next');
    // 新しいレベルに合格したとき、コンビニ回を終えたときだけ、次の場所へ案内する
    const moved = outcome.opened.length || outcome.allPassed || (lesson && lesson.shop);
    const onward = moved ? nextLesson() : null;
    goNext.hidden = !onward || isPassed(onward);
    if (onward) {
      goNext.textContent = `次へ：${lessonTitle(onward)}`;
      goNext.onclick = () => openLesson(onward);
    }

    const review = $('review');
    review.hidden = remaining === 0;
    review.textContent = `${isReview ? '続けて復習する' : '間違えた問題を復習する'}（${Math.min(remaining, ROUND_SIZE)}問）`;
    review.onclick = () => startRound(reviewSpecs(), 'review');

    const retry = $('retry');
    retry.hidden = isReview;
    retry.onclick = () => (timed ? startRound(attackSpecs(), 'attack') : playLesson(lesson));

    show('result');
    const buttons = [goNext, review, retry, $('back')];
    const firstButton = buttons.find(button => !button.hidden);
    buttons.forEach(button => button.classList.toggle('main', button === firstButton));
    if (timed) {
      // 時間切れの瞬間に連打していても、結果画面のボタンを誤って押さないように
      const actions = $('actions');
      actions.inert = true;
      setTimeout(() => {
        actions.inert = false;
        firstButton.focus({ preventScroll: true });
      }, 800);
    } else {
      firstButton.focus({ preventScroll: true });
    }
  }

  function goHome() {
    stopTimers();
    speech.stop();
    round = null;
    if (!course().placed) {
      show('welcome');
      return;
    }
    renderHome();
    show('start');
  }

  function openRecords() {
    disarmErase();
    resetExport();
    renderRecords();
    show('records');
  }

  /* ━━ 10. 操作 ━━ */

  $('continue').addEventListener('click', () => openLesson(nextLesson()));
  $('lessons').addEventListener('click', event => {
    const row = event.target.closest('[data-lesson]');
    if (row) openLesson(lessonById(row.dataset.lesson));
  });
  $('cards').addEventListener('click', event => {
    const card = event.target.closest('[data-say]');
    if (card) sayCard(card);
  });
  $('lesson-start').addEventListener('click', () => {
    speech.stop();
    playLesson(openedLesson);
  });
  $('lesson-back').addEventListener('click', goHome);
  $('first-time').addEventListener('click', () => {
    course().placed = true;
    store.save();
    openLesson(lessonOfLevel(1));
  });
  $('take-test').addEventListener('click', startTest);
  $('test-again').addEventListener('click', startTest);
  $('test-quit').addEventListener('click', goHome);
  $('test-skip').addEventListener('click', () => answerTest(false));
  testChoices.forEach((button, i) => button.addEventListener('click', () => answerTest(test.q.choices[i].right)));
  $('placed-restart').addEventListener('click', () => {
    course().cleared = 0;
    course().shops = {};
    store.save();
    openLesson(lessonOfLevel(1));
  });
  $('review-mode').addEventListener('click', () => startRound(reviewSpecs(), 'review'));
  $('attack-mode').addEventListener('click', () => startRound(attackSpecs(), 'attack'));
  options.forEach((button, i) => button.addEventListener('click', () => answer(i)));
  $('sound-toggle').addEventListener('click', () => {
    store.data.sound = !store.data.sound;
    store.save();
    renderSoundSetting();
    sound.play('tap'); // オンにしたときだけ鳴る
  });
  $('speak-toggle').addEventListener('click', () => {
    store.data.speak = !store.data.speak;
    store.save();
    renderSoundSetting();
  });
  // 選択肢は正解・不正解の音を鳴らすので、それ以外のボタンで「コツッ」と鳴らす。
  // 押した処理でボタンが無効になることがあるので、処理より先に判定する
  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (!button.classList.contains('option') && button.id !== 'sound-toggle') sound.play('tap');
  }, true);
  el.next.addEventListener('click', advance);
  $('quit').addEventListener('click', goHome);
  $('back').addEventListener('click', goHome);
  $('records-open').addEventListener('click', openRecords);
  $('records-back').addEventListener('click', goHome);
  $('export').addEventListener('click', copyStudyData);
  $('erase').addEventListener('click', () => {
    const erase = $('erase');
    if (erase.dataset.armed === undefined) {
      erase.dataset.armed = '';
      erase.textContent = 'もう一度押すと消します。元に戻せません';
      return;
    }
    const { sound: effects, speak } = store.data;
    store.reset();
    Object.assign(store.data, { sound: effects, speak });
    store.save();
    disarmErase();
    renderRecords();
  });
  el.play.addEventListener('click', () => playQuestion());
  $('slow').addEventListener('click', () => playQuestion(true));
  $('peek').addEventListener('click', () => {
    setGlyph(round.q.word, 'ko');
    el.listen.classList.add('peeked');
  });
  el.say.addEventListener('click', () => {
    clearTimeout(round.readTimer);
    speech.speak(round.q.say, {
      onFail() {
        if (!el.reveal.querySelector('.say-failed')) {
          el.reveal.append(make('p', 'how say-failed', '音声を再生できませんでした'));
        }
      },
    });
  });

  // 1〜4キーでも答えられる
  document.addEventListener('keydown', e => {
    if (screens.quiz.hidden || !round || round.answered || e.repeat) return;
    const i = ['1', '2', '3', '4'].indexOf(e.key);
    if (i >= 0) answer(i);
  });

  goHome();
  opened = true;
  // 音声の一覧は遅れて届くことがあるので、少し待ってから案内を判断する
  setTimeout(updateVoiceNote, 1500);
  if (speech.supported && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', updateVoiceNote);
  }

  /* ━━ 11. アプリとして使う（PWA） ━━
     Service Worker はファイルを端末に保存し、通信がなくても開けるようにする裏方の仕組み。
     https で公開した本来のページでだけ動かす。 */

  const isOwnPage = window.top === window.self && /^https?:$/.test(location.protocol);
  const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isAppleTouch = /iPhone|iPad/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvent = null;

  function renderInstall() {
    $('install').hidden = !installEvent;
    $('install-note').hidden = !(isOwnPage && isAppleTouch && !isInstalled());
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installEvent = event;
    renderInstall();
  });
  window.addEventListener('appinstalled', () => {
    installEvent = null;
    renderInstall();
  });
  $('install').addEventListener('click', () => {
    const event = installEvent;
    installEvent = null;
    renderInstall();
    if (event) event.prompt();
  });
  renderInstall();

  if (isOwnPage && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 使えなくても普通のページとして動く */ });
    });
  }

  // 自動テスト用の入口。テストのときだけ外から渡される
  if (window.__QUIZ_HOOK__) {
    window.__QUIZ_HOOK__({
      build, store, sound, LESSONS, attackSpecs, nextLesson, reviewSpecs,
      ITEMS, MORE_ITEMS, GOODS, PHRASES, MORE_PHRASES, STAFF, NOUNS, VERBS, HARD_WORDS, LINE_ITEMS, CLOCK_VERBS,
      ROUND_BIG, DAYS_IN_MONTH, range,
      playSpec: spec => startRound([spec], 'attempt'),
      playSpecs: specs => startRound(specs, 'attempt'),
      goHome,
      playLesson: id => playLesson(lessonById(id)),
      testRight: () => test.q.choices.findIndex(c => c.right),
      testLevel: () => test.level,
      rightIndex: () => round.q.choices.findIndex(c => c.right),
      currentKey: () => round.q.key,
      currentRound: () => round,
    });
  }
})();
</script>
</body>
</html>
