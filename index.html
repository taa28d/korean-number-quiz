  :root {
    --bg: #f7f5ef;       /* 한지 */
    --surface: #fffefb;
    --sunken: #ebe7dd;
    --line: #d3cdc0;
    --text: #15171f;     /* 먹 */
    --muted: #494b54;
    --accent: #1b3f8f;   /* 쪽빛 */
    --on-accent: #ffffff;
    --accent-soft: #e2e7f3;
    --accent-text: #1b3f8f;
    --hero: #1b3f8f;
    --on-hero: #ffffff;
    --good: #0f7a5c;     /* 비취 */
    --on-good: #ffffff;
    --good-soft: #dbf1e7;
    --good-text: #07573f;
    --bad: #c8322b;      /* 단청の朱 */
    --on-bad: #ffffff;
    --bad-soft: #fbe5e0;
    --bad-text: #a3231d;
    /* 색동（韓服の袖の縞）の5色 */
    --red: #c8322b;
    --yellow: #f0b429;
    --green: #12806a;
    --blue: #1b3f8f;
    --purple: #7b3f98;
    --on-dye: #ffffff;
    --on-yellow: #15171f;

    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif;
    --ko: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    --display: "Jua Numbers", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", "Yu Gothic UI", "Malgun Gothic", sans-serif;
    --radius: 12px;
    --band: 5px;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11131b;
      --surface: #1a1d28;
      --sunken: #262a37;
      --line: #3b4050;
      --text: #f3f4f8;
      --muted: #bfc5d2;
      --accent: #8fb0ff;
      --on-accent: #0b1226;
      --accent-soft: #222e52;
      --accent-text: #a9c2ff;
      --hero: #1d2f66;
      --on-hero: #ffffff;
      --good: #49d6a6;
      --on-good: #06261b;
      --good-soft: #143a2e;
      --good-text: #7ce8c3;
      --bad: #ff8e88;
      --on-bad: #300c0a;
      --bad-soft: #421f1d;
      --bad-text: #ffb3ae;
      --blue: #3f66c9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11131b;
    --surface: #1a1d28;
    --sunken: #262a37;
    --line: #3b4050;
    --text: #f3f4f8;
    --muted: #bfc5d2;
    --accent: #8fb0ff;
    --on-accent: #0b1226;
    --accent-soft: #222e52;
    --accent-text: #a9c2ff;
    --hero: #1d2f66;
    --on-hero: #ffffff;
    --good: #49d6a6;
    --on-good: #06261b;
    --good-soft: #143a2e;
    --good-text: #7ce8c3;
    --bad: #ff8e88;
    --on-bad: #300c0a;
    --bad-soft: #421f1d;
    --bad-text: #ffb3ae;
    --blue: #3f66c9;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  [lang="ko"] { font-family: var(--ko); }
  /* 色동の帯：どの画面でも上端に細く出す */
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    z-index: 10;
    height: calc(env(safe-area-inset-top, 0px) + var(--band));
    background: repeating-linear-gradient(90deg, var(--red) 0 2rem, var(--yellow) 2rem 4rem, var(--green) 4rem 6rem, var(--blue) 6rem 8rem, var(--purple) 8rem 10rem);
  }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  p { word-break: auto-phrase; }
  ul { list-style: none; }
  main {
    padding-top: var(--band);
    height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button {
    appearance: none;
    border: 0;
    border-radius: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon {
    display: block;
    width: 1.5rem;
    height: 1.5rem;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── ホーム ── */
  .start {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.25rem;
    max-width: 38rem;
    margin-inline: auto;
    padding-block: 1.25rem 1.5rem;
  }
  .start-head {
    display: grid;
    gap: .75rem;
    padding: .875rem 1rem 1rem;
    background: var(--hero);
    color: var(--on-hero);
    border-radius: 16px;
  }
  .start h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .subtitle { font-size: .9375rem; font-weight: 700; line-height: 1.3; }
  .hero { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; }
  .hero-word { display: grid; }
  .hero-word .digit { font-size: .875rem; line-height: 1.3; }
  .hero-word [lang="ko"] { font-family: var(--display); font-size: clamp(2.5rem, 13vw, 3.25rem); line-height: 1.1; white-space: nowrap; }
  .hero[data-sys="mix"] { gap: .25rem 1.125rem; }
  .hero[data-sys="mix"] .hero-word [lang="ko"] { font-size: clamp(1.625rem, 8vw, 2.25rem); }
  .settings, .plays { display: grid; gap: 1.25rem; align-content: start; min-width: 0; }
  .group { display: grid; gap: .5rem; min-width: 0; }
  .heading { font-size: .9375rem; font-weight: 700; color: var(--muted); line-height: 1.4; }
  .note { font-size: .9375rem; color: var(--muted); line-height: 1.55; }
  .note.warn { padding: .625rem .75rem; background: var(--accent-soft); color: var(--text); border-radius: var(--radius); }

  .picker {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: .25rem;
    padding: .25rem;
    background: var(--sunken);
    border-radius: var(--radius);
  }
  .seg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 3.625rem;
    padding: .25rem .125rem;
    border-radius: 9px;
    line-height: 1.3;
    text-align: center;
  }
  .seg b { font-size: clamp(.875rem, 4.1vw, 1rem); font-weight: 700; white-space: nowrap; }
  .seg span { font-size: .875rem; white-space: nowrap; }
  .seg[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg:disabled { color: var(--muted); cursor: default; }

  .modes {
    display: grid;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .mode {
    display: grid;
    grid-template-columns: 2.5rem minmax(0, 1fr) 1.25rem;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 4.25rem;
    padding: .5rem .75rem;
    text-align: left;
  }
  .mode + .mode { border-top: 1px solid var(--line); }
  .mode-icon {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    background: var(--accent-soft);
    color: var(--accent-text);
    border-radius: 10px;
    font-size: 1.375rem;
    line-height: 1;
  }
  .mode-icon[lang="ko"] { font-family: var(--display); }
  .t-red { background: var(--red); color: var(--on-dye); }
  .t-yellow { background: var(--yellow); color: var(--on-yellow); }
  .t-green { background: var(--green); color: var(--on-dye); }
  .t-blue { background: var(--blue); color: var(--on-dye); }
  .t-purple { background: var(--purple); color: var(--on-dye); }
  .mode-text { display: grid; min-width: 0; }
  .mode-text b { font-size: 1.125rem; font-weight: 700; line-height: 1.35; }
  .mode-sub { font-size: .9375rem; color: var(--muted); line-height: 1.4; }
  .mode .chevron { width: 1.25rem; height: 1.25rem; color: var(--muted); }
  .mode:disabled { cursor: default; }
  .mode:disabled .mode-icon { background: var(--sunken); color: var(--muted); }
  .mode:disabled .chevron { visibility: hidden; }

  /* ── 問題画面 ── */
  .quiz {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: .625rem;
    max-width: 38rem;
    height: 100%;
    min-height: 30rem;
    margin-inline: auto;
    padding-block: .375rem .75rem;
  }
  .bar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .5rem;
    min-height: 2.75rem;
  }
  .quit {
    min-height: 2.75rem;
    padding-inline: 0 .5rem;
    color: var(--muted);
    font-size: .9375rem;
    font-weight: 700;
  }
  .track { display: flex; gap: 3px; height: .5rem; }
  .bit { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 3px; transition: background-color .15s ease; }
  .bit[data-state="now"] { background: var(--accent); }
  .bit[data-state="done"] { background: var(--good); }
  .bit[data-state="miss"] { background: var(--bad); }
  .timer { height: .5rem; background: var(--line); border-radius: 3px; overflow: hidden; }
  .timer-bar {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--accent);
    transform-origin: left;
    transition: transform .2s linear, background-color .2s ease;
  }
  .timer-bar[data-low] { background: var(--bad); }
  .counter {
    display: grid;
    justify-items: end;
    min-width: 3.25rem;
    font-size: 1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    white-space: nowrap;
  }
  .combo { color: var(--accent-text); font-size: .875rem; }

  .question {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: .25rem;
    min-height: 0;
    padding: .75rem 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
    overflow: hidden;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .question[data-verdict="right"] { background: var(--good-soft); border-color: var(--good); }
  .question[data-verdict="wrong"] { background: var(--bad-soft); border-color: var(--bad); }
  .prompt { padding-inline: 2.5rem; color: var(--muted); font-size: 1.0625rem; font-weight: 700; line-height: 1.45; }
  .prompt.verdict { font-size: 1.375rem; line-height: 1.3; }
  .prompt.verdict [lang="ko"] { font-family: var(--display); }
  [data-verdict="right"] .prompt { color: var(--good-text); }
  [data-verdict="wrong"] .prompt { color: var(--bad-text); }
  .stage {
    container-type: size;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: .35rem;
    min-height: 0;
  }
  .glyph {
    font-family: var(--display);
    font-size: 3rem;
    font-size: min(calc(92cqw / var(--len, 1)), 78cqh, 8rem);
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
  }
  .stage:has(.gloss:not([hidden])) .glyph { font-size: min(calc(92cqw / var(--len, 1)), 52cqh, 8rem); }
  .stage.listening .glyph { font-size: min(calc(70cqw / var(--len, 1)), 30cqh, 4rem); }
  .gloss { color: var(--muted); font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }
  .reveal { min-height: 4rem; text-wrap: balance; }
  .reveal .pair { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .reveal .how { color: var(--text); font-size: .9375rem; line-height: 1.45; }

  .receipt {
    width: 100%;
    max-width: 26rem;
    padding: .375rem .625rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: clamp(.875rem, 4.6cqw, 1rem);
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
    text-align: left;
  }
  .receipt .line {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 3.4em;
    gap: .5em;
    align-items: baseline;
    white-space: nowrap;
  }
  .receipt .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .receipt .ko { font-weight: 700; }
  .receipt .ja { margin-left: .4em; color: var(--muted); }
  .receipt .sub { text-align: right; }
  .receipt .sum {
    grid-template-columns: minmax(0, 1fr) auto;
    margin-top: .2rem;
    padding-top: .2rem;
    border-top: 1px dashed var(--muted);
    font-weight: 700;
  }

  .say {
    position: absolute;
    top: .25rem;
    right: .25rem;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    color: var(--text);
  }
  .listen { display: grid; gap: .375rem; width: 100%; max-width: 24rem; }
  .listen-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .375rem; }
  .listen-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .375rem;
    min-width: 0;
    min-height: 2.75rem;
    padding: .25rem;
    background: var(--sunken);
    border-radius: 10px;
    font-size: .9375rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .play { background: var(--accent); color: var(--on-accent); min-height: 3rem; font-size: 1.0625rem; }
  .play[data-on] { background: var(--accent-soft); color: var(--accent-text); }
  .listen.peeked .listen-row { display: none; }
  .listen-note { font-size: .875rem; line-height: 1.4; }

  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
  .quiz[data-shape="wide"] .options { grid-template-columns: minmax(0, 1fr); }
  .option {
    font-family: var(--display);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: clamp(3.5rem, 12dvh, 5.5rem);
    padding: .25rem .5rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: clamp(1.5rem, 7vw, 2rem);
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .quiz[data-shape="wide"] .option {
    min-height: clamp(2.875rem, 7.4dvh, 3.75rem);
    font-size: clamp(1.125rem, 5.2vw, 1.375rem);
  }
  .option::after {
    position: absolute;
    top: .375rem;
    right: .5rem;
    font-family: var(--sans);
    font-size: 1.125rem;
    font-weight: 700;
    line-height: 1;
  }
  .quiz[data-shape="wide"] .option::after { top: 50%; transform: translateY(-50%); }
  .option:disabled { cursor: default; color: var(--muted); }
  .option[data-state="correct"] { background: var(--good); border-color: var(--good); color: var(--on-good); }
  .option[data-state="wrong"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad-text); }
  .option[data-state="correct"]::after { content: "✓"; }
  .option[data-state="wrong"]::after { content: "×"; }
  .option[data-hit] { z-index: 1; animation: pop .26s ease; }
  @keyframes pop {
    0% { transform: scale(.96); }
    55% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .next, .action {
    min-height: 3.25rem;
    padding: .5rem 1rem;
    border-radius: var(--radius);
    font-size: 1.0625rem;
    font-weight: 700;
  }
  .next { width: 100%; background: var(--accent); color: var(--on-accent); }
  .next:disabled { visibility: hidden; }
  .action { width: 100%; background: var(--surface); border: 1.5px solid var(--line); }
  #review, #review[hidden] + #retry { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* ── 結果画面・記録画面 ── */
  .result, .records {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
    max-width: 38rem;
    margin-inline: auto;
    padding-block: 1.25rem 1.5rem;
  }
  .score h2 {
    font-family: var(--display);
    font-size: clamp(2.75rem, 14vw, 4rem);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    line-height: 1.15;
  }
  .score p { color: var(--muted); font-size: 1rem; line-height: 1.55; }
  .score .cheer { color: var(--text); font-size: 1.125rem; font-weight: 700; }
  .cheer [lang="ko"] { color: var(--accent-text); font-family: var(--display); font-size: 1.5rem; }
  .actions { display: grid; gap: .5rem; }
  .stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: .5rem; }
  .stat {
    display: grid;
    align-content: start;
    min-width: 0;
    padding: .5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    line-height: 1.3;
  }
  .stat .label { color: var(--muted); font-size: .875rem; font-weight: 700; white-space: nowrap; }
  .stat .value { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .stat .sub { color: var(--muted); font-size: .875rem; }

  .scraps { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .scraps:empty { display: none; }
  .scrap {
    display: grid;
    grid-template-columns: 1.25rem minmax(0, 1fr);
    column-gap: .625rem;
    align-items: center;
    padding: .5rem .75rem;
  }
  .scrap + .scrap { border-top: 1px solid var(--line); }
  .scrap::before { content: "✓"; grid-row: 1 / span 2; color: var(--good-text); font-weight: 700; }
  .scrap.missed::before { content: "×"; color: var(--bad-text); }
  .scrap .word { font-family: var(--display); font-size: 1.125rem; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .scrap .num { color: var(--muted); font-size: .9375rem; line-height: 1.35; }

  .records-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .records-head h2 { font-size: 1.5rem; font-weight: 700; }
  .text-button { min-height: 2.75rem; padding-inline: .5rem 0; color: var(--accent-text); font-size: 1rem; font-weight: 700; }
  .record-lists { display: grid; gap: 1rem; min-width: 0; }
  .list-block { display: grid; gap: .25rem; min-width: 0; }
  .list-block h3 { color: var(--muted); font-size: .9375rem; font-weight: 700; }
  .rows { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .rows li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .75rem;
    align-items: baseline;
    padding: .5rem .75rem;
    font-size: 1rem;
    line-height: 1.4;
  }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows b { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .rows small { display: block; color: var(--muted); font-size: .875rem; }
  .rows .empty { display: block; color: var(--muted); font-size: .9375rem; }
  #erase { color: var(--bad-text); }
  #erase[data-armed] { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }

  /* 正解のときに広がる小さな丸 */
  .burst { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  .fly {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2);
    background: var(--red);
    border-radius: 50%;
  }
  .fly.blue { background: var(--blue); }
  .fly.gold { background: var(--yellow); }

  /* ── 広い画面：ホームは左右2列 ── */
  @media (min-width: 56rem) {
    .start { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 62rem; column-gap: 2rem; padding-block: 2.5rem; }
    .start-head { grid-column: 1 / -1; }
    .result, .records { padding-block: 2.5rem; }
    .record-lists { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .records { max-width: 52rem; }
    .quiz { padding-block: 1rem 1.5rem; }
  }

  /* ── 小さいスマホ ── */
  @media (max-height: 40rem) and (orientation: portrait) {
    .quiz { gap: .375rem; padding-bottom: .5rem; }
    .quiz[data-shape="wide"] .option { min-height: 2.75rem; }
    .next { min-height: 2.875rem; }
    .question { padding-block: .5rem; }
    .prompt.verdict { font-size: 1.25rem; }
    .receipt { padding-block: .125rem; line-height: 1.3; }
    .receipt .sum { margin-top: .125rem; padding-top: .125rem; }
  }

  /* ── スマホの横向き：左に問題、右に選択肢 ── */
  @media (orientation: landscape) and (max-height: 30rem) {
    .start { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); max-width: none; column-gap: 1.25rem; padding-block: .75rem; }
    .start-head { grid-column: 1 / -1; }
    .quiz {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: .375rem .75rem;
      max-width: none;
      min-height: 17rem;
      padding-block: .25rem .5rem;
    }
    .bar { grid-column: 1; grid-row: 1; }
    .question { grid-column: 1; grid-row: 2 / span 2; padding-block: .5rem; }
    .options, .quiz[data-shape="wide"] .options { grid-column: 2; grid-row: 1 / span 2; grid-auto-rows: 1fr; }
    .option, .quiz[data-shape="wide"] .option { min-height: 2.75rem; }
    .seg b { font-size: .875rem; }
    .next { grid-column: 2; grid-row: 3; min-height: 2.75rem; }
    .result, .records { max-width: 44rem; }
    .receipt { padding-block: .125rem; line-height: 1.3; }
    .receipt .sum { margin-top: .125rem; padding-top: .125rem; }
    .prompt.verdict { font-size: 1.25rem; }
  }

  @media (hover: hover) {
    .mode:hover:enabled, .seg:hover:enabled:not([aria-pressed="true"]) { background: var(--accent-soft); }
    .option:hover:enabled, .action:hover { border-color: var(--accent); }
    .next:hover, .listen-btn:hover { filter: brightness(1.08); }
  }
  button:active:enabled { filter: brightness(.95); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg style="display: none" aria-hidden="true">
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>

<main>
  <section id="start" class="start">
    <header class="start-head">
      <div>
        <h1>韓国語 数詞クイズ</h1>
        <p class="subtitle" lang="ko">한국어 숫자 퀴즈</p>
      </div>
      <div id="hero" class="hero"></div>
    </header>

    <div class="settings">
      <div class="group">
        <h2 class="heading">数え方</h2>
        <div id="sys" class="picker" role="group" aria-label="数え方">
          <button class="seg" data-sys="native"><b>固有数詞</b><span lang="ko">하나 둘 셋</span></button>
          <button class="seg" data-sys="sino"><b>漢数詞</b><span lang="ko">일 이 삼</span></button>
          <button class="seg" data-sys="mix"><b>場面ミックス</b><span>使い分ける</span></button>
        </div>
        <p id="sys-note" class="note"></p>
      </div>
      <div class="group">
        <h2 class="heading">レベル</h2>
        <div id="levels" class="picker" role="group" aria-label="レベル">
          <button class="seg" data-level="1"></button>
          <button class="seg" data-level="2"></button>
          <button class="seg" data-level="3"></button>
        </div>
        <p id="level-note" class="note" hidden></p>
      </div>
    </div>

    <div class="plays">
      <div class="group">
        <h2 class="heading">遊び方</h2>
        <div class="modes">
          <button class="mode" data-mode="read">

            <svg class="icon chevron"><use href="#i-chevron"/></svg>
          </button>
          <button class="mode" data-mode="listen">
            <span class="mode-icon t-red" lang="ko">듣</span>
            <span class="mode-text"><b>聞き取り</b><span class="mode-sub">音声を聞いて答える</span></span>
            <svg class="icon chevron"><use href="#i-chevron"/></svg>
          </button>
          <button class="mode" data-mode="counter">
            <span class="mode-icon t-green" lang="ko">개</span>
            <span class="mode-text"><b>助数詞</b><span class="mode-sub">〜個、〜人、〜杯の言い方</span></span>
            <svg class="icon chevron"><use href="#i-chevron"/></svg>
          </button>
          <button class="mode" data-mode="konbini">
            <span class="mode-icon t-yellow" lang="ko">원</span>
            <span class="mode-text"><b>コンビニ</b><span class="mode-sub">合計を言う、袋を頼む</span></span>

          <button class="mode" data-mode="attack">
            <span class="mode-icon t-purple" lang="ko">초</span>
            <span class="mode-text"><b>タイムアタック</b><span class="mode-sub">60秒で何問解けるか</span></span>
            <svg class="icon chevron"><use href="#i-chevron"/></svg>

      </div>
      <div class="modes">
        <button id="review-mode" class="mode" data-mode="review">
          <span class="mode-icon t-red" lang="ko">복</span>
          <span class="mode-text"><b>復習</b><span id="review-sub" class="mode-sub"></span></span>
          <svg class="icon chevron"><use href="#i-chevron"/></svg>
        </button>
        <button id="records-open" class="mode">
          <span class="mode-icon t-blue" lang="ko">록</span>
          <span class="mode-text"><b>記録</b><span id="record-line" class="mode-sub"></span></span>
          <svg class="icon chevron"><use href="#i-chevron"/></svg>
        </button>
        <button id="install" class="mode" hidden>
          <span class="mode-icon"><svg class="icon"><use href="#i-install"/></svg></span>
          <span class="mode-text"><b>アプリとして追加</b><span class="mode-sub">ホーム画面からすぐ開けます</span></span>
          <svg class="icon chevron"><use href="#i-chevron"/></svg>

      </div>
      <p id="install-note" class="note" hidden>Safariの共有ボタンから「ホーム画面に追加」を選ぶと、アプリとして使えます。</p>

    </div>
  </section>

  <section id="quiz" class="quiz" hidden>
    <div class="bar">
      <button id="quit" class="quit">やめる</button>
      <div id="track" class="track" aria-hidden="true"></div>

      <p class="counter"><span id="counter"></span><span id="combo" class="combo" hidden></span></p>
    </div>

    <div id="question" class="question">
      <button id="say" class="say" aria-label="発音を聞く" hidden><svg class="icon"><use href="#i-sound"/></svg></button>

<div id="burst" class="burst" aria-hidden="true"></div>

<script>
(() => {
  'use strict';

  /* ━━ 1. 数の読み方 ━━ */

  const ONES = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];
  const ONES_BEFORE_UNIT = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉'];
  const TENS = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔'];
  const SINO_DIGITS = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];

  const READ_NATIVE = {
    1: 'ハナ', 2: 'トゥル', 3: 'セッ', 4: 'ネッ', 5: 'タソッ',
    6: 'ヨソッ', 7: 'イルゴプ', 8: 'ヨドル', 9: 'アホプ', 10: 'ヨル',
    20: 'スムル', 30: 'ソルン', 40: 'マフン', 50: 'シュィン',
    60: 'イェスン', 70: 'イルン', 80: 'ヨドゥン', 90: 'アフン',
  };
  const READ_SINO = {
    1: 'イル', 2: 'イ', 3: 'サム', 4: 'サ', 5: 'オ', 6: 'ユク', 7: 'チル', 8: 'パル', 9: 'ク',
    10: 'シプ', 100: 'ペク', 1000: 'チョン', 10000: 'マン',
  };

  const nativeWord = n => TENS[Math.floor(n / 10)] + ONES[n % 10];

  // 助数詞の前では 하나→한、둘→두、셋→세、넷→네、스물→스무 に変わる
  const nativeBeforeUnit = n =>
    n === 20 ? '스무' : TENS[Math.floor(n / 10)] + ONES_BEFORE_UNIT[n % 10];

  function sinoBelow10000(n) {
    let text = '';
    for (const [unit, name] of [[1000, '천'], [100, '백'], [10, '십']]) {
      const digit = Math.floor(n / unit) % 10;
      if (digit) text += (digit === 1 ? '' : SINO_DIGITS[digit]) + name;
    }
    return text + SINO_DIGITS[n % 10];
  }

  // 만の位で分かち書きする（15,000 → 만 오천）
  function sinoWord(n) {
    const man = Math.floor(n / 10000);
    const rest = n % 10000;
    const parts = [];
    if (man) parts.push(man === 1 ? '만' : sinoBelow10000(man) + '만');
    if (rest) parts.push(sinoBelow10000(rest));
    return parts.join(' ');
  }

  const fmt = n => n.toLocaleString('en-US');
  const priceWord = n => `${sinoWord(n)} 원`;
  const monthWord = m => ({ 6: '유월', 10: '시월' })[m] ?? `${sinoWord(m)}월`;
  const dayWord = d => `${sinoWord(d)}일`;
  const dateWord = (m, d) => `${monthWord(m)} ${dayWord(d)}`;

  /* ━━ 2. 問題の材料 ━━ */

  const ROUND_SIZE = 10;
  const DAYS_IN_MONTH = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

  const UNITS = { 개: '個', 명: '人', 잔: '杯', 병: '本' };
  const ITEMS = [
    { id: 'apple', ko: '사과', ja: 'りんご', c: '개' },
    { id: 'mandarin', ko: '귤', ja: 'みかん', c: '개' },
    { id: 'bread', ko: '빵', ja: 'パン', c: '개' },
    { id: 'egg', ko: '달걀', ja: '卵', c: '개' },
    { id: 'student', ko: '학생', ja: '学生', c: '명' },
    { id: 'friend', ko: '친구', ja: '友だち', c: '명' },
    { id: 'child', ko: '아이', ja: '子ども', c: '명' },
    { id: 'coffee', ko: '커피', ja: 'コーヒー', c: '잔' },
    { id: 'tea', ko: '차', ja: 'お茶', c: '잔' },
    { id: 'juice', ko: '주스', ja: 'ジュース', c: '잔' },
    { id: 'beer', ko: '맥주', ja: 'ビール', c: '병' },
    { id: 'soju', ko: '소주', ja: '焼酎', c: '병' },
    { id: 'water', ko: '물', ja: '水', c: '병' },
  ];
  const itemById = id => ITEMS.find(item => item.id === id);

  // コンビニの商品。値段は練習用の目安
  const GOODS = [
    { id: 'kimbap', ko: '삼각김밥', ja: '三角おにぎり', price: 1200 },
    { id: 'ramen', ko: '컵라면', ja: 'カップ麺', price: 1500 },
    { id: 'banana', ko: '바나나우유', ja: 'バナナ牛乳', price: 1700 },
    { id: 'water', ko: '생수', ja: '水', price: 1000 },
    { id: 'coffee', ko: '커피', ja: 'コーヒー', price: 1800 },
    { id: 'snack', ko: '과자', ja: 'お菓子', price: 2000 },
    { id: 'choco', ko: '초콜릿', ja: 'チョコレート', price: 1400 },
    { id: 'bento', ko: '도시락', ja: 'お弁当', price: 4500 },
    { id: 'sandwich', ko: '샌드위치', ja: 'サンドイッチ', price: 2800 },
  ];
  const goodById = id => GOODS.find(good => good.id === id);

  // レジで使う言い回し
  const PHRASES = {
    card: { ask: 'カードで払いたい', ko: '카드로 할게요', how: '카드 = カード、할게요 = 〜にします' },
    cash: { ask: '現金で払いたい', ko: '현금으로 할게요', how: '현금 = 現金、할게요 = 〜にします' },
    receipt: { ask: 'レシートがほしい', ko: '영수증 주세요', how: '영수증 = レシート、주세요 = ください' },
    noBag: { ask: '袋はいらない', ko: '봉투는 괜찮아요', how: '봉투 = 袋、괜찮아요 = 結構です' },
    total: { ask: '全部でいくらか聞きたい', ko: '전부 얼마예요?', how: '전부 = 全部、얼마 = いくら' },
    heat: { ask: '温めてほしい', ko: '데워 주세요', how: '데우다 = 温める、주세요 = ください' },
    chopsticks: { ask: 'お箸がほしい', ko: '젓가락 주세요', how: '젓가락 = お箸、주세요 = ください' },
  };

  // 字面や響きが似ていて取り違えやすい組み合わせ
  const LOOK_NATIVE = {
    1: [2], 2: [1, 3], 3: [4, 2], 4: [3, 5], 5: [6, 4], 6: [5, 8, 10], 7: [9, 8], 8: [6, 10], 9: [7, 8],
    10: [6, 8, 20], 20: [10, 30], 30: [20, 80], 40: [70, 90], 50: [60, 40],
    60: [50, 80], 70: [40, 90], 80: [30, 60, 90], 90: [40, 70, 80],
  };
  const LOOK_SINO = {
    1: [2, 7, 8], 2: [1, 4], 3: [4, 10], 4: [3, 10], 5: [9, 2],
    6: [9, 1], 7: [1, 8], 8: [7, 1], 9: [6, 5], 10: [4, 3],
  };

  const range = (from, to, step = 1) =>
    Array.from({ length: Math.floor((to - from) / step) + 1 }, (_, i) => from + i * step);

  const ROUND_BIG = [...range(100, 900, 100), ...range(1000, 9000, 1000), ...range(10000, 90000, 10000)];

  function shuffle(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const sample = (list, count) => shuffle(list).slice(0, count);
  const pickOne = list => list[Math.floor(Math.random() * list.length)];

  /* ━━ 3. 間違いの選択肢 ━━ */

  const poolOf = n => (n <= 10 ? range(1, 10) : n < 100 ? range(10, 99) : ROUND_BIG);

  function wrongNumbers(sys, n) {
    const native = sys === 'native';
    const table = native ? LOOK_NATIVE : LOOK_SINO;
    const pool = poolOf(n);
    const ten = n - n % 10;
    const one = n % 10;
    const close = [];
    const related = [];

    if (n >= 100) {
      const unit = 10 ** (String(n).length - 1);
      const lead = n / unit;
      close.push(...LOOK_SINO[lead].filter(x => x < 10).map(x => x * unit), n * 10, n / 10);
      related.push(...range(1, 9).map(x => x * unit));
    } else if (ten && one) {
      for (const x of table[one]) if (x < 10) close.push(ten + x);
      if (native) {
        for (const x of table[ten]) if (x % 10 === 0) close.push(x + one);
      } else {
        for (const x of table[ten / 10]) if (x < 10) close.push(x * 10 + one);
        close.push(one * 10 + ten / 10); // 27と72のように位を取り違える
      }
      related.push(...range(1, 9).map(x => ten + x), ...range(1, 9).map(x => x * 10 + one));
    } else {
      close.push(...(table[n] ?? table[n / 10].map(x => x * 10)));
      related.push(...(one ? range(1, 9) : range(10, 90, 10)));
    }

    const wrong = [];
    for (const tier of [shuffle(close).slice(0, 2), shuffle(related), shuffle(pool)]) {
      for (const x of tier) {
        if (x !== n && pool.includes(x) && !wrong.includes(x)) wrong.push(x);
      }
    }
    return wrong;
  }

  function closePrices(n) {
    const unit = 10 ** (String(n).length - 1);
    const lead = Math.floor(n / unit);
    const nextUnit = unit / 10;
    const second = Math.floor(n / nextUnit) % 10;
    const near = LOOK_SINO[lead].filter(x => x < 10).map(x => n + (x - lead) * unit);
    if (second) near.push(...LOOK_SINO[second].filter(x => x < 10).map(x => n + (x - second) * nextUnit));
    near.push(n + unit, n - unit, n * 10, n + nextUnit);
    return shuffle([...new Set(near)]).filter(x => x > 0 && x !== n && x % 100 === 0 && x < 100000);
  }

  // 値段を固有数詞で言ってしまった形（実際には使わない言い方）
  function priceInNative(n) {
    const man = Math.floor(n / 10000);
    const cheon = Math.floor(n / 1000) % 10;
    const baek = Math.floor(n / 100) % 10;
    const parts = [];
    if (man) parts.push(`${nativeBeforeUnit(man)}만`);
    const rest = (cheon ? `${nativeBeforeUnit(cheon)}천` : '') + (baek ? `${nativeBeforeUnit(baek)}백` : '');
    if (rest) parts.push(rest);
    return `${parts.join(' ')} 원`;
  }

  function wrongDates(m, d) {
    const months = (m <= 10 ? LOOK_SINO[m] : m === 11 ? [12, 1] : [11, 2]).filter(x => x <= 12 && d <= DAYS_IN_MONTH[x - 1]);
    const days = wrongNumbers('sino', d).filter(x => x <= 28).slice(0, 4);
    return shuffle([...months.map(x => [x, d]), ...days.map(x => [m, x])]);
  }

  function choiceSet(right, wrongs, lang) {
    const picked = [...new Set(wrongs)].filter(text => text !== right).slice(0, 3);
    return shuffle([
      { text: right, lang, right: true },
      ...picked.map(text => ({ text, lang, right: false })),
    ]);
  }

  /* ━━ 4. 問題を組み立てる ━━
     spec は問題の中身だけを持つ小さな記録。build(spec) で画面に出す形にする。 */

  const SYS_NAME = { native: '固有数詞', sino: '漢数詞' };

  function placeValues(n) {
    return [...String(n)]
      .map((digit, i, all) => Number(digit) * 10 ** (all.length - 1 - i))
      .filter(Boolean);
  }

  function howToRead(sys, n) {
    const reading = (sys === 'native' ? READ_NATIVE : READ_SINO)[n];
    if (reading) return { text: reading };
    const wordOf = sys === 'native' ? nativeWord : sinoWord;
    return { text: placeValues(n).map(p => `${wordOf(p)} ${fmt(p)}`).join(' + '), lang: 'ko' };
  }

  function buildNumber({ sys, n, listen }) {
    const wordOf = sys === 'native' ? nativeWord : sinoWord;
    const word = wordOf(n);
    const wrong = wrongNumbers(sys, n);
    const base = {
      key: `num:${sys}:${n}`,
      word,
      note: fmt(n),
      say: word,
      pair: `${fmt(n)} = ${word}`,
      how: howToRead(sys, n),
    };
    if (listen) {
      return { ...base, prompt: '聞こえた数はどれ？', choices: choiceSet(fmt(n), wrong.map(fmt), 'ja') };
    }
    if (Math.random() < .5) {
      return {
        ...base,
        prompt: 'この韓国語はいくつ？',
        show: { text: word, lang: 'ko' },
        choices: choiceSet(fmt(n), wrong.map(fmt), 'ja'),
      };
    }
    return {
      ...base,
      prompt: `この数を${SYS_NAME[sys]}で言うと？`,
      show: { text: fmt(n), lang: 'ja' },
      choices: choiceSet(word, wrong.map(wordOf), 'ko'),
    };
  }

  function buildCounter({ item: id, n, ask, listen }) {
    const item = itemById(id);
    const unitJa = UNITS[item.c];
    const form = nativeBeforeUnit(n);
    const plain = nativeWord(n);
    const koOf = (word, unit = item.c) => `${item.ko} ${word} ${unit}`;
    const jaOf = x => `${item.ja} ${x}${unitJa}`;
    const word = koOf(form);
    const ja = jaOf(n);
    const others = wrongNumbers('native', n);
    const base = {
      key: `cnt:${id}:${n}:${ask}`,
      word,
      note: ja,
      say: word,
      pair: `${ja} = ${word}`,
      how: { text: `${plain === form ? '' : `助数詞の前で ${plain} → ${form}。`}${item.c} = ${unitJa}` },
    };
    if (listen) {
      return { ...base, prompt: '聞こえたのはどれ？', choices: choiceSet(ja, others.map(jaOf), 'ja') };
    }
    if (ask === 'ja') {
      return { ...base, prompt: 'どういう意味？', show: { text: word, lang: 'ko' }, choices: choiceSet(ja, others.map(jaOf), 'ja') };
    }
    if (ask === 'unit') {
      return {
        ...base,
        prompt: '□に入る助数詞は？',
        show: { text: `${item.ko} ${form} □`, lang: 'ko' },
        gloss: ja,
        choices: choiceSet(item.c, Object.keys(UNITS), 'ko'),
      };
    }
    const wrongForms = [
      ...(plain === form ? [] : [koOf(plain)]),
      koOf(sinoWord(n)),
      ...others.map(x => koOf(nativeBeforeUnit(x))),
    ];
    return { ...base, prompt: '個数の言い方は？', show: { text: ja, lang: 'ja' }, choices: choiceSet(word, wrongForms, 'ko') };
  }

  function buildPrice({ n, listen }) {
    const word = priceWord(n);
    const ja = `${fmt(n)}ウォン`;
    const near = closePrices(n);
    const base = {
      key: `price:${n}`,
      word,
      note: ja,
      say: word,
      pair: `${ja} = ${word}`,
      how: { text: '値段は漢数詞で言います' },
    };
    if (listen) {
      return { ...base, prompt: '聞こえた値段はどれ？', choices: choiceSet(ja, near.map(x => `${fmt(x)}ウォン`), 'ja') };
    }
    return {
      ...base,
      prompt: '値段の言い方は？',
      show: { text: ja, lang: 'ja' },
      choices: choiceSet(word, [priceInNative(n), ...near.map(priceWord)], 'ko'),
    };
  }

  function buildDate({ m, d, listen }) {
    const word = dateWord(m, d);
    const ja = `${m}月${d}日`;
    const near = wrongDates(m, d);
    const irregular = { 6: '육월', 10: '십월' }[m];
    const base = {
      key: `date:${m}:${d}`,
      word,
      note: ja,
      say: word,
      pair: `${ja} = ${word}`,
      how: { text: irregular ? `日付は漢数詞。${m}月は ${irregular} ではなく ${monthWord(m)}` : '日付は漢数詞で言います' },
    };
    if (listen) {
      return { ...base, prompt: '聞こえた日付はどれ？', choices: choiceSet(ja, near.map(([x, y]) => `${x}月${y}日`), 'ja') };
    }
    const wrongForms = [
      ...(irregular ? [`${irregular} ${dayWord(d)}`] : []),
      `${nativeBeforeUnit(m)} 월 ${nativeBeforeUnit(d)} 일`,
      ...near.map(([x, y]) => dateWord(x, y)),
    ];
    return { ...base, prompt: '日付の言い方は？', show: { text: ja, lang: 'ja' }, choices: choiceSet(word, wrongForms, 'ko') };
  }

  function buildTotal({ cart }) {
    const lines = cart.map(([id, qty]) => ({ good: goodById(id), qty }));
    const total = lines.reduce((sum, { good, qty }) => sum + good.price * qty, 0);
    const word = priceWord(total);
    const ja = `${fmt(total)}ウォン`;
    const near = closePrices(total);
    const oneMissed = pickOne(lines.map(({ good, qty }) => total - good.price * qty)); // 1品足し忘れた金額
    return {
      key: `total:${cart.map(line => line.join('*')).join(',')}`,
      word,
      note: ja,
      say: `전부 ${word}입니다`,
      pair: `${ja} = ${word}`,
      how: { text: `店員さんは 전부 ${word}입니다 と言います` },
      prompt: '合計を韓国語で言うと？',
      receipt: { lines, total },
      choices: choiceSet(word, [...shuffle([oneMissed, ...near.slice(0, 3)]), ...near].map(priceWord), 'ko'),
    };
  }

  // 「봉투 두 개 주세요」の形。数の間違いをいくつか混ぜる
  function buildAsk(key, koName, n, askText, how) {
    const say = word => `${koName} ${word} 개 주세요`;
    const word = say(nativeBeforeUnit(n));
    return {
      key,
      word,
      note: askText,
      say: word,
      pair: word,
      how: { text: how },
      prompt: 'レジで何と言う？',
      show: { text: askText, lang: 'ja' },
      choices: choiceSet(word, [
        say(nativeWord(n)),
        say(sinoWord(n)),
        ...wrongNumbers('native', n).map(x => say(nativeBeforeUnit(x))),
      ], 'ko'),
    };
  }

  const buildBag = ({ n }) =>
    buildAsk(`bag:${n}`, '봉투', n, `袋を${n}枚ください`, '봉투 = 袋、주세요 = ください');

  function buildBuy({ good: id, n }) {
    const good = goodById(id);
    return buildAsk(`buy:${id}:${n}`, good.ko, n, `${good.ja}を${n}個ください`, `${good.ko} = ${good.ja}、주세요 = ください`);
  }

  function buildPhrase({ id }) {
    const phrase = PHRASES[id];
    const others = Object.values(PHRASES).filter(other => other !== phrase).map(other => other.ko);
    return {
      key: `phrase:${id}`,
      word: phrase.ko,
      note: phrase.ask,
      say: phrase.ko,
      pair: phrase.ko,
      how: { text: phrase.how },
      prompt: 'レジで何と言う？',
      show: { text: phrase.ask, lang: 'ja' },
      choices: choiceSet(phrase.ko, shuffle(others), 'ko'),
    };
  }

  const BUILDERS = {
    num: buildNumber, cnt: buildCounter, price: buildPrice, date: buildDate,
    total: buildTotal, bag: buildBag, buy: buildBuy, phrase: buildPhrase,
  };

  function build(spec) {
    const q = BUILDERS[spec.t](spec);
    if (spec.listen) q.key += ':listen';
    return { ...q, listen: Boolean(spec.listen), spec };
  }

  /* ━━ 5. 1回分の問題を選ぶ ━━ */

  function pickNumbers(sys, level) {
    if (level === 1) return shuffle(range(1, 10));
    if (level === 2) {
      // 2桁は 스물・서른 などの十の位を覚えないと読めないので、切りのいい数を必ず混ぜる
      const others = sample(range(11, 99).filter(n => n % 10), ROUND_SIZE - 3);
      return shuffle([...sample(range(20, 90, 10), 3), ...others]);
    }
    if (sys === 'sino') return shuffle([...sample(range(1, 99), 6), ...sample(ROUND_BIG, 4)]);
    return sample(range(1, 99), ROUND_SIZE);
  }

  function pickPrice(level) {
    const small = () => pickOne(range(1, 9)) * pickOne([100, 1000]);
    const large = () => (Math.random() < .5
      ? pickOne(range(1, 9)) * 1000 + pickOne(range(1, 9)) * 100
      : pickOne(range(1, 9)) * 10000 + pickOne(range(0, 9)) * 1000);
    if (level === 1) return small();
    if (level === 2) return large();
    return Math.random() < .5 ? small() : large();
  }

  function pickDate(level) {
    const m = pickOne(range(1, 12));
    const max = DAYS_IN_MONTH[m - 1];
    const d = pickOne(level === 1 ? range(1, 10) : level === 2 ? range(11, max) : range(1, max));
    return { m, d };
  }

  function sceneSpecs(level) {
    const seen = new Set();
    const specs = [];
    const add = (count, make) => {
      while (specs.length < count) {
        const spec = make();
        const key = build(spec).key;
        if (!seen.has(key)) { seen.add(key); specs.push(spec); }
      }
    };
    const numbers = pickNumbers('native', level);
    add(4, () => ({ t: 'cnt', item: pickOne(ITEMS).id, n: numbers[specs.length], ask: 'ko' }));
    add(7, () => ({ t: 'price', n: pickPrice(level) }));
    add(ROUND_SIZE, () => ({ t: 'date', ...pickDate(level) }));
    return shuffle(specs);
  }

  function counterSpecs(level) {
    const asks = shuffle(['ko', 'ko', 'ko', 'ko', 'unit', 'unit', 'unit', 'ja', 'ja', 'ja']);
    const units = Object.keys(UNITS);
    return pickNumbers('native', level).map((n, i) => ({
      t: 'cnt',
      item: pickOne(ITEMS.filter(item => item.c === units[i % units.length])).id,
      n,
      ask: asks[i],
    }));
  }

  function pickCart() {
    return sample(GOODS, pickOne([2, 2, 3])).map(good => [good.id, pickOne([1, 1, 2, 3])]);
  }

  // 3回の買い物：注文 → 合計 → 袋 → 支払い の流れで、回ごとに少し変える
  function konbiniSpecs() {
    const carts = [pickCart(), pickCart(), pickCart()];
    const bags = shuffle([{ t: 'bag', n: 1 }, { t: 'bag', n: 2 }, { t: 'bag', n: 3 }, { t: 'phrase', id: 'noBag' }]);
    const closing = sample(['card', 'cash', 'receipt', 'chopsticks', 'total', 'heat'], 3).map(id => ({ t: 'phrase', id }));
    const order = cart => ({ t: 'buy', good: cart[0][0], n: cart[0][1] });
    const total = cart => ({ t: 'total', cart });
    return [
      order(carts[0]), total(carts[0]), closing[0],
      total(carts[1]), bags[0], closing[1],
      order(carts[2]), total(carts[2]), bags[1], closing[2],
    ];
  }

  function roundSpecs(mode, sys, level) {
    if (mode === 'review') return reviewSpecs();
    if (mode === 'konbini') return konbiniSpecs();
    if (mode === 'counter') return counterSpecs(level);
    const specs = sys === 'mix'
      ? sceneSpecs(level)
      : pickNumbers(sys, level).map(n => ({ t: 'num', sys, n }));
    return mode === 'listen' ? specs.map(spec => ({ ...spec, listen: true })) : specs;
  }

  /* ━━ 6. 音声（Web Speech API） ━━ */

  const speech = (() => {
    const synth = window.speechSynthesis || null;
    let voice = null;
    let current = null;
    let watchdog = 0;

    function refresh() {
      if (!synth) return;
      const voices = synth.getVoices();
      voice = voices.find(v => /^ko[-_]KR$/i.test(v.lang)) || voices.find(v => /^ko\b/i.test(v.lang)) || null;
    }

    function stop() {
      clearTimeout(watchdog);
      current = null;
      if (synth && (synth.speaking || synth.pending)) synth.cancel();
    }

    function speak(text, { slow = false, onStart, onEnd, onFail } = {}) {
      stop();
      if (!synth) { if (onFail) onFail(); return; }
      if (synth.paused) synth.resume();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = slow ? .6 : .9;
      if (voice) utterance.voice = voice;
      const mine = fn => (...args) => { if (current === utterance && fn) fn(...args); };
      utterance.onstart = mine(() => { clearTimeout(watchdog); if (onStart) onStart(); });
      utterance.onend = mine(() => { clearTimeout(watchdog); if (onEnd) onEnd(); });
      utterance.onerror = mine(event => {
        clearTimeout(watchdog);
        const stopped = event.error === 'canceled' || event.error === 'interrupted'; // 再生し直しただけ
        if (stopped && onEnd) onEnd();
        if (!stopped && onFail) onFail();
      });
      current = utterance;
      synth.speak(utterance);
      watchdog = setTimeout(mine(onFail), 3000); // 無音のまま止まる端末があるため
    }

    if (synth) {
      refresh();
      if (synth.addEventListener) synth.addEventListener('voiceschanged', refresh);
    }
    return { speak, stop, refresh, supported: Boolean(synth), hasVoice: () => Boolean(voice) };
  })();

  /* ━━ 7. 保存（localStorage） ━━
     ブラウザの中の小さな保存場所。使えない環境でも、その場では普通に遊べるようにする。 */

  const STORE_KEY = 'korean-number-quiz';
  const HISTORY_SIZE = 30;
  const PASS_SCORE = 8;        // 10問中これだけ正解すると次のレベルへ
  const ATTACK_SECONDS = 60;
  const MODE_NAME = {
    read: '読み方', listen: '聞き取り', attack: 'タイムアタック',
    counter: '助数詞', konbini: 'コンビニ', review: '復習',
  };
  const SYS_LABEL = { native: '固有数詞', sino: '漢数詞', mix: '場面ミックス' };

  const store = (() => {
    const fresh = () => ({
      review: {},
      sys: 'native',
      level: 1,
      unlocked: { native: 1, sino: 1, mix: 1 },
      best: {},
      history: [],
      streak: { days: 0, best: 0, last: '' },
      totals: { answered: 0, correct: 0, bestCombo: 0 },
    });
    const isRecord = value => Boolean(value) && typeof value === 'object' && !Array.isArray(value);
    const count = value => (Number.isFinite(value) && value >= 0 ? value : 0);
    const isEntry = entry => isRecord(entry) && MODE_NAME[entry.mode] && SYS_LABEL[entry.sys] && [1, 2, 3].includes(entry.level)
      && [entry.score, entry.at, entry.correct, entry.total].every(Number.isFinite);

    // 保存データの形が想定と違う項目は捨てて、その項目だけ最初の状態に戻す
    function read() {
      const data = fresh();
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch { /* 読めないときは最初の状態で始める */ }
      if (!isRecord(saved)) return data;
      data.sys = saved.sys;
      data.level = saved.level;
      if (isRecord(saved.review)) data.review = saved.review;
      if (isRecord(saved.best)) {
        data.best = Object.fromEntries(Object.entries(saved.best).filter(([, entry]) => isEntry(entry)));
      }
      if (Array.isArray(saved.history)) data.history = saved.history.filter(isEntry).slice(0, HISTORY_SIZE);
      if (isRecord(saved.unlocked)) {
        for (const key of Object.keys(data.unlocked)) {
          if ([1, 2, 3].includes(saved.unlocked[key])) data.unlocked[key] = saved.unlocked[key];
        }
      }
      if (isRecord(saved.streak)) {
        data.streak = { days: count(saved.streak.days), best: count(saved.streak.best), last: String(saved.streak.last || '') };
      }
      if (isRecord(saved.totals)) {
        for (const key of Object.keys(data.totals)) data.totals[key] = count(saved.totals[key]);
      }
      return data;
    }

    const self = {
      data: read(),
      save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(self.data)); } catch { /* 保存できなくても続ける */ }
      },
      reset() {
        self.data = fresh();
        self.save();
      },
    };
    return self;
  })();

  function canBuild(spec) {
    try {
      return !/undefined|NaN/.test(build(spec).word);
    } catch {
      return false;
    }
  }

  function cleanReview() {
    for (const [key, entry] of Object.entries(store.data.review)) {
      if (!entry || !canBuild(entry.spec)) delete store.data.review[key];
    }
  }

  function addMistake(q) {
    const before = store.data.review[q.key];
    store.data.review[q.key] = { spec: q.spec, misses: (before ? before.misses : 0) + 1, at: Date.now() };
  }

  const reviewCount = () => Object.keys(store.data.review).length;

  function reviewSpecs() {
    const newest = Object.values(store.data.review).sort((a, b) => b.at - a.at).slice(0, ROUND_SIZE);
    return shuffle(newest.map(entry => entry.spec));
  }

  const dayKey = date => `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;

  function yesterdayKey() {
    const date = new Date();
    date.setDate(date.getDate() - 1);
    return dayKey(date);
  }

  // ストリーク：1問でも答えた日が何日続いているか
  function touchStreak() {
    const { streak } = store.data;
    const today = dayKey(new Date());
    if (streak.last === today) return;
    streak.days = streak.last === yesterdayKey() ? streak.days + 1 : 1;
    streak.last = today;
    streak.best = Math.max(streak.best, streak.days);
  }

  function currentStreak() {
    const { days, last } = store.data.streak;
    return last === dayKey(new Date()) || last === yesterdayKey() ? days : 0;
  }

  // 連続で正解するほど1問の点が増える（200点で頭打ち）
  const pointsFor = combo => 100 + 10 * Math.min(combo - 1, 10);

  function bestKey({ mode, sys, level }) {
    if (mode === 'review') return null;
    if (mode === 'konbini') return 'konbini';
    if (mode === 'counter') return `counter:${level}`;
    return `${mode}:${sys}:${level}`;
  }

  function roundLabel({ mode, sys, level }) {
    if (mode === 'review' || mode === 'konbini') return MODE_NAME[mode];
    if (mode === 'counter') return `${MODE_NAME.counter} Lv.${level}`;
    return `${MODE_NAME[mode]} ${SYS_LABEL[sys]} Lv.${level}`;
  }

  /* ━━ 8. 画面 ━━ */

  const SYSTEMS = {
    native: {
      note: '「ひとつ、ふたつ」にあたる数え方。物や人の数に使います。',
      hero: [['1', '하나'], ['2', '둘'], ['3', '셋']],
      levels: ['1〜10', '2桁', 'ミックス'],
    },
    sino: {
      note: '「いち、に、さん」にあたる数え方。値段や日付に使います。',
      hero: [['1', '일'], ['2', '이'], ['3', '삼']],
      levels: ['1〜10', '2桁', '百・千・万も'],
    },
    mix: {
      note: '個数は固有数詞、値段と日付は漢数詞。場面に合う言い方を選びます。',
      hero: [['3個', '세 개'], ['3月', '삼월'], ['1,000ウォン', '천 원']],
      levels: ['小さい数', '大きい数', 'ミックス'],
    },
  };

  const $ = id => document.getElementById(id);
  const screens = { start: $('start'), quiz: $('quiz'), result: $('result'), records: $('records') };
  const options = [...document.querySelectorAll('.option')];
  const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const el = {
    counter: $('counter'), track: $('track'), question: $('question'), prompt: $('prompt'), stage: $('stage'),
    glyph: $('glyph'), gloss: $('gloss'), reveal: $('reveal'), next: $('next'), say: $('say'),
    listen: $('listen'), play: $('play'), listenNote: $('listen-note'), voiceNote: $('voice-note'),
    receipt: $('receipt'), combo: $('combo'), timer: $('timer'), timerBar: $('timer-bar'), burst: $('burst'),
  };

  cleanReview();
  let sys = SYSTEMS[store.data.sys] ? store.data.sys : 'native';
  let level = [1, 2, 3].includes(store.data.level) ? Math.min(store.data.level, store.data.unlocked[sys]) : 1;
  let round = null;

  function show(name) {
    for (const [key, screen] of Object.entries(screens)) screen.hidden = key !== name;
    window.scrollTo(0, 0);
  }

  function make(tag, className, text, lang) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    if (lang) node.lang = lang;
    return node;
  }

  function renderHero() {
    const hero = $('hero');
    if (hero.dataset.sys === sys) return;
    hero.dataset.sys = sys;
    hero.replaceChildren(...SYSTEMS[sys].hero.map(([label, word]) => {
      const box = make('div', 'hero-word');
      box.append(make('span', 'digit', label), make('span', '', word, 'ko'));
      return box;
    }));
  }

  function renderPickers() {
    document.querySelectorAll('#sys [data-sys]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.sys === sys));
    });
    $('sys-note').textContent = SYSTEMS[sys].note;
    const unlocked = store.data.unlocked[sys];
    document.querySelectorAll('[data-level]').forEach((button, i) => {
      const locked = i + 1 > unlocked;
      button.disabled = locked;
      button.setAttribute('aria-pressed', String(i + 1 === level));
      button.replaceChildren(
        make('b', '', `Lv.${i + 1}`),
        make('span', '', locked ? `${PASS_SCORE}問で解放` : SYSTEMS[sys].levels[i]),
      );
    });
    const levelNote = $('level-note');
    levelNote.hidden = unlocked === 3;
    levelNote.textContent = `読み方か聞き取りで10問中${PASS_SCORE}問正解すると、次のレベルが開きます。`;
  }

  function renderReview() {
    const count = reviewCount();
    $('review-mode').disabled = count === 0;
    $('review-sub').textContent = count ? `間違えた${count}問` : 'まだありません';
  }

  function renderHomeRecord() {
    $('record-line').textContent = `ストリーク ${currentStreak()}日、最高 ${store.data.totals.bestCombo}コンボ`;
  }

  function renderHome() {
    renderHero();
    renderPickers();
    renderReview();
    renderHomeRecord();
  }

  function statBox(label, value, sub) {
    const box = make('div', 'stat');
    box.append(make('span', 'label', label), make('span', 'value', value));
    if (sub) box.append(make('span', 'sub', sub));
    return box;
  }

  function recordRow(entry, withDate) {
    const row = make('li');
    const name = make('span', '', roundLabel(entry));
    if (withDate) {
      const when = new Date(entry.at);
      const clock = `${when.getHours()}:${String(when.getMinutes()).padStart(2, '0')}`;
      name.append(make('small', '', `${when.getMonth() + 1}/${when.getDate()} ${clock}、${entry.total}問中${entry.correct}問正解`));
    }
    row.append(name, make('b', '', `${fmt(entry.score)}点`));
    return row;
  }

  function fillRows(list, rows, emptyText) {
    list.replaceChildren(...(rows.length ? rows : [make('li', 'empty', emptyText)]));
  }

  function renderRecords() {
    const { totals, streak, best, history } = store.data;
    const rate = totals.answered ? Math.round(totals.correct / totals.answered * 100) : 0;
    $('record-stats').replaceChildren(
      statBox('ストリーク', `${currentStreak()}日`, `最長${streak.best}日`),
      statBox('正解数', `${fmt(totals.correct)}問`, `正答率${rate}%`),
      statBox('最高コンボ', String(totals.bestCombo), '連続正解の数'),
    );
    const bests = Object.values(best).sort((a, b) => b.score - a.score);
    fillRows($('best-list'), bests.map(entry => recordRow(entry, false)), 'まだ記録がありません。1回遊ぶとここに残ります。');
    fillRows($('history-list'), history.slice(0, 10).map(entry => recordRow(entry, true)), 'まだ記録がありません。');
  }

  function disarmErase() {
    const erase = $('erase');
    delete erase.dataset.armed;
    erase.textContent = '記録をすべて消す';
  }

  function renderReceipt({ lines, total }, answered) {
    const rows = lines.map(({ good, qty }) => {
      const row = make('p', 'line');
      const name = make('span', 'name');
      name.append(make('span', 'ko', good.ko, 'ko'), make('span', 'ja', good.ja));
      row.append(name, make('span', 'qty', `${fmt(good.price)} × ${qty}`), make('span', 'sub', fmt(good.price * qty)));
      return row;
    });
    const sum = make('p', 'line sum');
    sum.append(make('span', 'name', '合計'), make('span', 'sub', answered ? `${fmt(total)}ウォン` : '？'));
    el.receipt.replaceChildren(...rows, sum);
  }

  function voiceHelp() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad/.test(ua)) return '韓国語の音声が見つかりません。設定の「読み上げコンテンツ」で韓国語の声を追加すると聞き取りが使えます。';
    if (/Android/.test(ua)) return '韓国語の音声が見つかりません。端末の設定の「テキスト読み上げ」で韓国語の音声データを追加すると聞き取りが使えます。';
    return '韓国語の音声が見つかりません。端末の言語設定で韓国語の音声を追加すると聞き取りが使えます。聞き取りは「文字で見る」でも進められます。';
  }

  function updateVoiceNote() {
    speech.refresh();
    el.voiceNote.hidden = speech.hasVoice();
    el.voiceNote.textContent = speech.hasVoice() ? '' : voiceHelp();
  }

  function stopTimers() {
    if (!round) return;
    clearInterval(round.ticker);
    clearTimeout(round.autoNext);
  }

  function tick() {
    const left = Math.max(0, round.deadline - performance.now());
    el.counter.textContent = `${Math.ceil(left / 1000)}秒`;
    el.timerBar.style.transform = `scaleX(${left / (ATTACK_SECONDS * 1000)})`;
    el.timerBar.toggleAttribute('data-low', left < 10000);
    if (left <= 0) showResult();
  }

  function startRound(specs, mode, roundSys = sys, roundLevel = level) {
    stopTimers();
    const timed = mode === 'attack';
    round = {
      specs, mode, timed, sys: roundSys, level: roundLevel,
      index: 0, results: [], answered: false, q: null,
      combo: 0, bestCombo: 0, score: 0, deadline: 0, ticker: 0, autoNext: 0,
    };
    el.track.hidden = timed;
    el.timer.hidden = !timed;
    el.track.replaceChildren(...(timed ? [] : specs).map(() => make('span', 'bit')));
    renderCombo();
    show('quiz');
    showQuestion();
    if (timed) {
      round.deadline = performance.now() + ATTACK_SECONDS * 1000;
      tick();
      round.ticker = setInterval(tick, 200);
    }
  }

  function renderCombo() {
    el.combo.hidden = round.combo < 2;
    el.combo.textContent = `${round.combo}コンボ`;
  }

  // 正解した選択肢から小さな丸が広がる。コンボが続くほど数が増える
  function celebrate(button, combo) {
    if (calmMotion.matches || !button.animate) return;
    const box = button.getBoundingClientRect();
    const fromX = box.left + box.width / 2;
    const fromY = box.top + box.height / 2;
    for (let i = 0, count = Math.min(8 + combo * 2, 24); i < count; i++) {
      const piece = make('i', `fly ${pickOne(['', 'blue', 'gold'])}`);
      piece.style.setProperty('--size', `${6 + Math.random() * 7}px`);
      el.burst.append(piece);
      const angle = -Math.PI / 2 + (Math.random() - .5) * 1.8;
      const reach = 70 + Math.random() * (110 + combo * 12);
      const toX = fromX + Math.cos(angle) * reach;
      const toY = fromY + Math.sin(angle) * reach;
      const spin = (Math.random() - .5) * 540;
      const duration = 600 + Math.random() * 250;
      piece.animate([
        { transform: `translate(${fromX}px, ${fromY}px) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${toX}px, ${toY}px) rotate(${spin}deg)`, opacity: 1, offset: .7 },
        { transform: `translate(${toX}px, ${toY + 36}px) rotate(${spin * 1.2}deg)`, opacity: 0 },
      ], { duration, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'forwards' });
      setTimeout(() => piece.remove(), duration + 50);
    }
    if (combo >= 2) el.combo.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' });
  }

  // 全角1、半角0.62、空白0.35文字として、見出しの幅を見積もる
  const textWidth = text => [...text].reduce((sum, ch) => sum + (ch === ' ' ? .35 : ch < '\u0080' ? .62 : 1.02), 0);

  function setGlyph(text, lang) {
    el.glyph.textContent = text;
    el.glyph.lang = lang;
    el.glyph.style.setProperty('--len', textWidth(text));
    el.glyph.hidden = false;
  }

  function playQuestion(slow = false) {
    const { q } = round;
    el.play.dataset.on = '';
    speech.speak(q.say, {
      slow,
      onStart() { el.listenNote.hidden = true; },
      onEnd() { delete el.play.dataset.on; },
      onFail() {
        delete el.play.dataset.on;
        el.listenNote.textContent = speech.supported
          ? '音声が再生できませんでした。「文字で見る」で続けられます。'
          : 'この端末は読み上げに対応していません。「文字で見る」で続けられます。';
        el.listenNote.hidden = false;
      },
    });
  }

  function showQuestion() {
    const q = build(round.specs[round.index]);
    round.q = q;
    round.answered = false;

    if (!round.timed) {
      el.counter.textContent = `${round.index + 1} / ${round.specs.length}`;
      el.track.children[round.index].dataset.state = 'now';
    }
    el.prompt.textContent = q.prompt;
    el.prompt.classList.remove('verdict');
    el.reveal.replaceChildren();
    el.say.hidden = true;
    delete el.play.dataset.on;
    delete el.question.dataset.verdict;

    el.stage.classList.toggle('listening', q.listen);
    el.listen.hidden = !q.listen;
    el.listen.classList.remove('peeked');
    el.listenNote.hidden = true;
    el.gloss.hidden = !q.gloss;
    el.gloss.textContent = q.gloss || '';
    if (q.show) setGlyph(q.show.text, q.show.lang);
    else el.glyph.hidden = true;
    el.receipt.hidden = !q.receipt;
    if (q.receipt) renderReceipt(q.receipt, false);

    screens.quiz.dataset.shape = q.choices.some(c => textWidth(c.text) > 4.2) ? 'wide' : 'short';
    options.forEach((button, i) => {
      const choice = q.choices[i];
      button.textContent = choice.text;
      button.lang = choice.lang;
      button.disabled = false;
      delete button.dataset.state;
      delete button.dataset.hit;
    });
    el.next.disabled = true;
    el.next.textContent = '';
    options[0].focus({ preventScroll: true });
    if (q.listen) playQuestion();
  }

  function answer(i) {
    if (!round || round.answered) return;
    round.answered = true;

    const { q } = round;
    const correct = q.choices[i].right;
    round.results.push({ q, correct });

    round.combo = correct ? round.combo + 1 : 0;
    round.bestCombo = Math.max(round.bestCombo, round.combo);
    if (correct) round.score += pointsFor(round.combo);

    const { totals } = store.data;
    totals.answered += 1;
    if (correct) totals.correct += 1;
    totals.bestCombo = Math.max(totals.bestCombo, round.combo);
    touchStreak();
    if (!correct) addMistake(q);
    else if (round.mode === 'review') delete store.data.review[q.key];
    store.save();

    options.forEach((button, j) => {
      button.disabled = true;
      button.dataset.state = q.choices[j].right ? 'correct' : j === i ? 'wrong' : 'rest';
    });
    if (!round.timed) el.track.children[round.index].dataset.state = correct ? 'done' : 'miss';

    el.prompt.replaceChildren(
      correct ? '○ ' : '× ',
      make('span', '', correct ? '정답!' : '오답', 'ko'),
      !correct ? ' 不正解' : round.combo >= 2 ? ` ${round.combo}コンボ` : ' 正解',
    );
    el.prompt.classList.add('verdict');
    el.question.dataset.verdict = correct ? 'right' : 'wrong';
    renderCombo();
    if (correct) {
      options[i].dataset.hit = '';
      celebrate(options[i], round.combo);
    }
    el.listen.hidden = true;
    el.gloss.hidden = true;
    if (q.listen) { el.stage.classList.remove('listening'); setGlyph(q.word, 'ko'); }
    if (q.show && q.show.text.includes('□')) setGlyph(q.word, 'ko');
    if (q.receipt) renderReceipt(q.receipt, true);
    el.reveal.replaceChildren(make('p', 'pair', q.pair), make('p', 'how', q.how.text, q.how.lang));
    el.say.hidden = false;

    const last = !round.timed && round.index === round.specs.length - 1;
    el.next.textContent = last ? '結果を見る' : '次の問題';
    el.next.disabled = false;
    el.next.focus({ preventScroll: true });
    if (round.timed) round.autoNext = setTimeout(advance, correct ? 500 : 1400);
  }

  function advance() {
    clearTimeout(round.autoNext);
    speech.stop();
    round.index += 1;
    if (round.timed && round.index >= round.specs.length) {
      round.specs.push(...roundSpecs('attack', round.sys, round.level));
    }
    if (round.index < round.specs.length) showQuestion();
    else showResult();
  }

  // 1回分の結果を保存し、レベルの解放と自己ベストを判定する
  function recordRound() {
    const { mode, sys: roundSys, level: roundLevel, results, score, bestCombo } = round;
    const key = bestKey(round);
    const outcome = { best: 0, newBest: false, unlockedLevel: 0 };
    if (results.length) {
      const correct = results.filter(r => r.correct).length;
      const entry = { at: Date.now(), mode, sys: roundSys, level: roundLevel, correct, total: results.length, score, combo: bestCombo };
      store.data.history = [entry, ...store.data.history].slice(0, HISTORY_SIZE);

      if (key) {
        const before = store.data.best[key];
        outcome.newBest = Boolean(before) && score > before.score;
        if (!before || score > before.score) store.data.best[key] = entry;
        outcome.best = store.data.best[key].score;
      }

      const { unlocked } = store.data;
      const passed = (mode === 'read' || mode === 'listen') && results.length === ROUND_SIZE && correct >= PASS_SCORE;
      if (passed && roundLevel === unlocked[roundSys] && roundLevel < 3) {
        unlocked[roundSys] = roundLevel + 1;
        outcome.unlockedLevel = roundLevel + 1;
        if (roundSys === sys) {
          level = roundLevel + 1;
          store.data.level = level;
        }
      }
      store.save();
    } else if (key && store.data.best[key]) {
      outcome.best = store.data.best[key].score;
    }
    return outcome;
  }

  function cheerFor(rate) {
    if (rate === 1) return ['완벽해요!', '完璧です'];
    if (rate >= .8) return ['잘했어요!', 'よくできました'];
    if (rate >= .5) return ['좋아요!', 'いい調子です'];
    return ['다시 해 봐요!', 'もう一度やってみましょう'];
  }

  function showResult() {
    stopTimers();
    speech.stop();
    const { results, mode, timed, score, bestCombo } = round;
    const outcome = recordRound();
    const wrong = results.filter(r => !r.correct).map(r => r.q.spec);
    const right = results.length - wrong.length;

    $('score').textContent = timed ? `${fmt(score)}点` : `${right} / ${results.length}`;
    $('score').setAttribute('aria-label', timed ? `${fmt(score)}点、${right}問正解` : `${results.length}問中${right}問正解`);
    const remaining = reviewCount();
    const isReview = mode === 'review';
    const notes = [];
    if (isReview) notes.push(remaining ? `あと${remaining}問残っています。正解した問題は復習リストから消えました。` : '復習リストが空になりました。');
    else if (timed) notes.push(`${ATTACK_SECONDS}秒で${right}問正解しました。`);
    else if (wrong.length) notes.push('間違えた問題は復習リストに保存しました。');
    else notes.push('全問正解です。');
    if (outcome.newBest) notes.push('自己ベストを更新しました。');
    if (outcome.unlockedLevel) notes.push(`Lv.${outcome.unlockedLevel} に進めるようになりました。`);
    $('score-note').textContent = notes.join('');

    const cheer = $('cheer');
    cheer.hidden = !results.length;
    if (results.length) {
      const [ko, ja] = cheerFor(right / results.length);
      cheer.replaceChildren(make('span', '', ko, 'ko'), ` ${ja}`);
    }

    $('stats').replaceChildren(
      statBox('スコア', fmt(score)),
      statBox('最大コンボ', String(bestCombo)),
      ...(isReview ? [] : [statBox('自己ベスト', outcome.best ? fmt(outcome.best) : 'なし')]),
    );

    // 間違えた問題を先に見せる。タイムアタックは問題数が多いので12問まで
    const ordered = [...results.filter(r => !r.correct), ...results.filter(r => r.correct)];
    const shown = timed ? ordered.slice(0, 12) : ordered;
    $('scraps').replaceChildren(...shown.map(r => {
      const scrap = make('li', r.correct ? 'scrap' : 'scrap missed');
      scrap.append(make('span', 'word', r.q.word, 'ko'), make('span', 'num', r.q.note));
      return scrap;
    }));

    const review = $('review');
    review.hidden = remaining === 0;
    review.textContent = `${isReview ? '続けて復習する' : '間違えた問題を復習する'}（${Math.min(remaining, ROUND_SIZE)}問）`;
    review.onclick = () => startRound(reviewSpecs(), 'review');

    const retry = $('retry');
    retry.hidden = isReview;
    retry.onclick = () => startRound(roundSpecs(mode, round.sys, round.level), mode, round.sys, round.level);

    show('result');
    const firstButton = remaining ? review : isReview ? $('back') : retry;
    if (timed) {
      // 時間切れの瞬間に連打していても、結果画面のボタンを誤って押さないように
      const actions = $('actions');
      actions.inert = true;
      setTimeout(() => {
        actions.inert = false;
        firstButton.focus({ preventScroll: true });
      }, 800);
    } else {
      firstButton.focus({ preventScroll: true });
    }
  }

  function goHome() {
    stopTimers();
    speech.stop();
    round = null;
    renderHome();
    show('start');
  }

  function openRecords() {
    disarmErase();
    renderRecords();
    show('records');
  }

  /* ━━ 9. 操作 ━━ */

  document.querySelectorAll('#sys [data-sys]').forEach(button => {
    button.addEventListener('click', () => {
      sys = button.dataset.sys;
      level = Math.min(level, store.data.unlocked[sys]);
      store.data.sys = sys;
      store.data.level = level;
      store.save();
      renderHero();
      renderPickers();
    });
  });
  document.querySelectorAll('[data-level]').forEach(button => {
    button.addEventListener('click', () => {
      level = Number(button.dataset.level);
      store.data.level = level;
      store.save();
      renderPickers();
    });
  });
  document.querySelectorAll('[data-mode]').forEach(button => {
    button.addEventListener('click', () => startRound(roundSpecs(button.dataset.mode, sys, level), button.dataset.mode));
  });
  options.forEach((button, i) => button.addEventListener('click', () => answer(i)));
  el.next.addEventListener('click', advance);
  $('quit').addEventListener('click', goHome);
  $('back').addEventListener('click', goHome);
  $('records-open').addEventListener('click', openRecords);
  $('records-back').addEventListener('click', goHome);
  $('erase').addEventListener('click', () => {
    const erase = $('erase');
    if (erase.dataset.armed === undefined) {
      erase.dataset.armed = '';
      erase.textContent = 'もう一度押すと消します。元に戻せません';
      return;
    }
    store.reset();
    sys = 'native';
    level = 1;
    disarmErase();
    renderRecords();
  });
  el.play.addEventListener('click', () => playQuestion());
  $('slow').addEventListener('click', () => playQuestion(true));
  $('peek').addEventListener('click', () => {
    setGlyph(round.q.word, 'ko');
    el.listen.classList.add('peeked');
  });
  el.say.addEventListener('click', () => {
    speech.speak(round.q.say, {
      onFail() {
        if (!el.reveal.querySelector('.say-failed')) {
          el.reveal.append(make('p', 'how say-failed', '音声を再生できませんでした'));
        }
      },
    });
  });

  // 1〜4キーでも答えられる
  document.addEventListener('keydown', e => {
    if (screens.quiz.hidden || !round || round.answered || e.repeat) return;
    const i = ['1', '2', '3', '4'].indexOf(e.key);
    if (i >= 0) answer(i);
  });

  renderHome();
  // 音声の一覧は遅れて届くことがあるので、少し待ってから案内を判断する
  setTimeout(updateVoiceNote, 1500);
  if (speech.supported && window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', updateVoiceNote);
  }

  /* ━━ 10. アプリとして使う（PWA） ━━
     Service Worker はファイルを端末に保存し、通信がなくても開けるようにする裏方の仕組み。
     https で公開した本来のページでだけ動かす。 */

  const isOwnPage = window.top === window.self && /^https?:$/.test(location.protocol);
  const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isAppleTouch = /iPhone|iPad/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvent = null;

  function renderInstall() {
    $('install').hidden = !installEvent;
    $('install-note').hidden = !(isOwnPage && isAppleTouch && !isInstalled());
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installEvent = event;
    renderInstall();
  });
  window.addEventListener('appinstalled', () => {
    installEvent = null;
    renderInstall();
  });
  $('install').addEventListener('click', () => {
    const event = installEvent;
    installEvent = null;
    renderInstall();
    if (event) event.prompt();
  });
  renderInstall();

  if (isOwnPage && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 使えなくても普通のページとして動く */ });
    });
  }

  // 自動テスト用の入口。テストのときだけ外から渡される
  if (window.__QUIZ_HOOK__) {
    window.__QUIZ_HOOK__({
      build, roundSpecs, store, ITEMS, GOODS, PHRASES, ROUND_BIG, DAYS_IN_MONTH, range,
      playSpec: spec => startRound([spec], 'read'),
      rightIndex: () => round.q.choices.findIndex(c => c.right),
      currentKey: () => round.q.key,
      currentRound: () => round,
    });
  }
})();
</script>
</body>
</html>
