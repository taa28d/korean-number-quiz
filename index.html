  :root {
    --bg: #f7f5ef;       /* 한지 */
    --surface: #fffefb;
    --sunken: #ebe7dd;
    --line: #d3cdc0;
    --text: #15171f;     /* 먹 */
    --muted: #494b54;
    --accent: #1b3f8f;   /* 쪽빛 */
    --on-accent: #ffffff;
    --accent-soft: #e2e7f3;
    --accent-text: #1b3f8f;
    --hero: #1b3f8f;
    --on-hero: #ffffff;
    --good: #0f7a5c;     /* 비취 */
    --on-good: #ffffff;
    --good-soft: #dbf1e7;
    --good-text: #07573f;
    --bad: #c8322b;      /* 단청の朱 */
    --on-bad: #ffffff;
    --bad-soft: #fbe5e0;
    --bad-text: #a3231d;
    /* 색동（韓服の袖の縞）の5色 */
    --red: #c8322b;
    --yellow: #f0b429;
    --green: #12806a;
    --blue: #1b3f8f;
    --purple: #7b3f98;
    --on-dye: #ffffff;
    --on-yellow: #15171f;

    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif;
    --ko: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    --display: "Jua Numbers", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", "Yu Gothic UI", "Malgun Gothic", sans-serif;
    --radius: 12px;
    --band-gap: 0px;
    --band-line: 5px;
    --band: calc(var(--band-gap) + var(--band-line));
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* iPhoneは画面の上端近くをぼかすので、縦向きのときは帯をその下まで下げる */
  @supports (-webkit-touch-callout: none) {
    @media (orientation: portrait) {
      :root { --band-gap: 18px; }
    }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11131b;
      --surface: #1a1d28;
      --sunken: #262a37;
      --line: #3b4050;
      --text: #f3f4f8;
      --muted: #bfc5d2;
      --accent: #8fb0ff;
      --on-accent: #0b1226;
      --accent-soft: #222e52;
      --accent-text: #a9c2ff;
      --hero: #1d2f66;
      --on-hero: #ffffff;
      --good: #49d6a6;
      --on-good: #06261b;
      --good-soft: #143a2e;
      --good-text: #7ce8c3;
      --bad: #ff8e88;
      --on-bad: #300c0a;
      --bad-soft: #421f1d;
      --bad-text: #ffb3ae;
      --blue: #3f66c9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11131b;
    --surface: #1a1d28;
    --sunken: #262a37;
    --line: #3b4050;
    --text: #f3f4f8;
    --muted: #bfc5d2;
    --accent: #8fb0ff;
    --on-accent: #0b1226;
    --accent-soft: #222e52;
    --accent-text: #a9c2ff;
    --hero: #1d2f66;
    --on-hero: #ffffff;
    --good: #49d6a6;
    --on-good: #06261b;
    --good-soft: #143a2e;
    --good-text: #7ce8c3;
    --bad: #ff8e88;
    --on-bad: #300c0a;
    --bad-soft: #421f1d;
    --bad-text: #ffb3ae;
    --blue: #3f66c9;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  [lang="ko"] { font-family: var(--ko); }
  /* 色동の帯：どの画面でも上に細く出す。帯より上は背景色で埋め、スクロールした文字を隠す */
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    z-index: 10;
    height: calc(env(safe-area-inset-top, 0px) + var(--band));
    background: repeating-linear-gradient(90deg, var(--red) 0 2rem, var(--yellow) 2rem 4rem, var(--green) 4rem 6rem, var(--blue) 6rem 8rem, var(--purple) 8rem 10rem) bottom / 100% var(--band-line) no-repeat var(--bg);
  }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  p { word-break: auto-phrase; }
  ul { list-style: none; }
  /* 画面が広がる動きで、横にはみ出さないようにする */
  .frame { height: 100%; overflow-x: clip; }
  main {
    position: relative;
    z-index: 1;
    padding-top: var(--band);
    height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main[data-moving] { background: var(--bg); }
  /* 切り替わるときに後ろで消えていく、前の画面の写し */
  .leaving {
    position: fixed;
    inset: 0;
    z-index: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + var(--band));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    overflow: hidden;
    pointer-events: none;
  }
  .leaving * { animation: none !important; transition: none !important; }
  button {
    appearance: none;
    border: 0;
    border-radius: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon {
    display: block;
    width: 1.5rem;
    height: 1.5rem;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── ホーム ── */
  .start {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.25rem;
    max-width: 38rem;
    margin-inline: auto;
    padding-block: 1.25rem 1.5rem;
  }
  .start-head {
    display: grid;
    gap: .75rem;
    padding: .875rem 1rem 1rem;
    background: var(--hero);
    color: var(--on-hero);
    border-radius: 16px;
  }
  .start-head h1 { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .subtitle { font-size: .9375rem; font-weight: 700; line-height: 1.3; }
  .hero { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; }
  .hero-word { display: grid; }
  .hero-word .digit { font-size: .875rem; line-height: 1.3; }
  .hero-word [lang="ko"] { font-family: var(--display); font-size: clamp(2.5rem, 13vw, 3.25rem); line-height: 1.1; white-space: nowrap; }
  .hero[data-long] { gap: .25rem 1.125rem; }
  .hero[data-long] .hero-word [lang="ko"] { font-size: clamp(1.625rem, 8vw, 2.25rem); }
  .course, .plays { display: grid; gap: 1.25rem; align-content: start; min-width: 0; }
  .group { display: grid; gap: .5rem; min-width: 0; }
  .heading { font-size: .9375rem; font-weight: 700; color: var(--muted); line-height: 1.4; }
  .note { font-size: .9375rem; color: var(--muted); line-height: 1.55; }
  .note.warn { padding: .625rem .75rem; background: var(--accent-soft); color: var(--text); border-radius: var(--radius); }

  .primary {
    display: grid;
    gap: .125rem;
    width: 100%;
    min-height: 3.5rem;
    padding: .625rem 1rem;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: var(--radius);
    text-align: left;
  }
  .primary b { font-size: 1.125rem; font-weight: 700; line-height: 1.35; }
  .primary span { font-size: .9375rem; line-height: 1.4; }
  .primary.center { justify-items: center; text-align: center; }

  .modes {
    display: grid;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .mode {
    display: grid;
    grid-template-columns: 2.5rem minmax(0, 1fr) 1.25rem;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 4.25rem;
    padding: .5rem .75rem;
    text-align: left;
  }
  .mode + .mode { border-top: 1px solid var(--line); }
  .mode-icon {
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    background: var(--accent-soft);
    color: var(--accent-text);
    border-radius: 10px;
    font-size: 1.375rem;
    line-height: 1;
  }
  .mode-icon[lang="ko"] { font-family: var(--display); }
  .t-red { background: var(--red); color: var(--on-dye); }
  .t-yellow { background: var(--yellow); color: var(--on-yellow); }
  .t-green { background: var(--green); color: var(--on-dye); }
  .t-blue { background: var(--blue); color: var(--on-dye); }
  .t-purple { background: var(--purple); color: var(--on-dye); }
  .mode-text { display: grid; min-width: 0; }
  .mode-text b { font-size: 1.125rem; font-weight: 700; line-height: 1.35; }
  .mode-sub { font-size: .9375rem; color: var(--muted); line-height: 1.4; }
  .mode .chevron { width: 1.25rem; height: 1.25rem; color: var(--muted); }
  .mode:disabled { cursor: default; }
  .mode:disabled .mode-icon { background: var(--sunken); color: var(--muted); }
  .mode:disabled .mode-text { color: var(--muted); }
  .mode:disabled .chevron { visibility: hidden; }
  .mode-icon.level-icon { font-family: var(--sans); font-size: 1.125rem; font-weight: 700; }
  .mode-icon.passed { background: var(--good); color: var(--on-good); }
  .mode.now { background: var(--accent-soft); }
  .mode.now .mode-icon { background: var(--accent); color: var(--on-accent); }

  /* レベル一覧の区切り：今いない区切りは閉じておき、一覧が長くなりすぎないようにする */
  .parts { display: grid; gap: .5rem; }
  .part-name {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 1.25rem;
    align-items: center;
    gap: .5rem;
    min-height: 3rem;
    padding: .375rem .75rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-weight: 700;
    cursor: pointer;
    list-style: none;
  }
  .part-name::-webkit-details-marker { display: none; }
  .part-name .chevron { width: 1.25rem; height: 1.25rem; color: var(--muted); transition: transform .2s ease; }
  .part[open] .part-name .chevron { transform: rotate(90deg); }
  .part[open] .modes { margin-top: .5rem; }

  /* ── レベルの画面 ── */
  .lesson {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
    max-width: 38rem;
    margin-inline: auto;
    padding-block: .75rem 1.5rem;
  }
  .back {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: .25rem;
    min-height: 2.75rem;
    padding-inline: 0 .75rem;
    color: var(--accent-text);
    font-size: 1rem;
    font-weight: 700;
  }
  .back .icon { width: 1.25rem; height: 1.25rem; transform: rotate(180deg); }
  .lead { display: grid; gap: .375rem; }
  .lead h2 { font-size: 1.375rem; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .secondary {
    width: 100%;
    min-height: 3rem;
    padding: .5rem 1rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-weight: 700;
  }

  /* 覚えるカード：押すと発音を聞ける */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .5rem; }
  .cards.wide { grid-template-columns: minmax(0, 1fr); }
  .cards.pairs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards.pairs [lang="ko"] { font-size: 1.25rem; }
  .card {
    display: grid;
    justify-items: center;
    align-content: center;
    gap: .125rem;
    min-height: 4.75rem;
    padding: .5rem .25rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
  }
  .card .digit { color: var(--muted); font-size: .9375rem; line-height: 1.3; }
  .card [lang="ko"] { font-family: var(--display); font-size: 1.5rem; line-height: 1.25; }
  .card[data-on] { background: var(--accent-soft); border-color: var(--accent); }

  /* ── 理解度テスト ── */
  .test-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: .9375rem; font-weight: 700; }
  .test-card {
    display: grid;
    justify-items: center;
    align-content: center;
    gap: .25rem;
    min-height: 11rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
  }
  .test-word {
    font-family: var(--display);
    font-size: max(1.5rem, min(clamp(2rem, 10vw, 2.75rem), calc(76vw / var(--len, 1))));
    line-height: 1.2;
    text-wrap: balance;
  }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
  .choices[data-wide] { grid-template-columns: minmax(0, 1fr); }
  .choice {
    min-width: 0;
    min-height: 3.5rem;
    padding: .25rem .5rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-family: var(--display);
    font-size: clamp(1.25rem, 5.6vw, 1.5rem);
    line-height: 1.2;
  }

  /* ── 問題画面 ── */
  .quiz {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: .625rem;
    max-width: 38rem;
    height: 100%;
    min-height: 30rem;
    margin-inline: auto;
    padding-block: .375rem .75rem;
  }
  .bar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .5rem;
    min-height: 2.75rem;
  }
  .quit {
    min-height: 2.75rem;
    padding-inline: 0 .5rem;
    color: var(--muted);
    font-size: .9375rem;
    font-weight: 700;
  }
  .track { display: flex; gap: 3px; height: .5rem; }
  .bit { flex: 1 1 0; min-width: 0; background: var(--line); border-radius: 3px; transition: background-color .15s ease; }
  .bit[data-state="now"] { background: var(--accent); }
  .bit[data-state="done"] { background: var(--good); }
  .bit[data-state="miss"] { background: var(--bad); }
  .timer { height: .5rem; background: var(--line); border-radius: 3px; overflow: hidden; }
  .timer-bar {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--accent);
    transform-origin: left;
    transition: transform .2s linear, background-color .2s ease;
  }
  .timer-bar[data-low] { background: var(--bad); }
  .counter {
    display: grid;
    justify-items: end;
    min-width: 3.25rem;
    font-size: 1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    white-space: nowrap;
  }
  .combo { color: var(--accent-text); font-size: .875rem; }

  .question {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: .25rem;
    min-height: 0;
    padding: .75rem 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
    overflow: hidden;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .question[data-verdict="right"] { background: var(--good-soft); border-color: var(--good); }
  .question[data-verdict="wrong"] { background: var(--bad-soft); border-color: var(--bad); }
  .prompt { padding-inline: 2.5rem; color: var(--muted); font-size: 1.0625rem; font-weight: 700; line-height: 1.45; }
  .prompt.verdict { font-size: 1.375rem; line-height: 1.3; }
  .prompt.verdict [lang="ko"] { font-family: var(--display); }
  [data-verdict="right"] .prompt { color: var(--good-text); }
  [data-verdict="wrong"] .prompt { color: var(--bad-text); }
  .stage {
    container-type: size;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: .35rem;
    min-height: 0;
  }
  .glyph {
    font-family: var(--display);
    font-size: 3rem;
    font-size: min(calc(92cqw / var(--len, 1)), 78cqh, 8rem);
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
  }
  .stage:has(.gloss:not([hidden])) .glyph { font-size: min(calc(92cqw / var(--len, 1)), 52cqh, 8rem); }
  .stage.listening .glyph { font-size: min(calc(70cqw / var(--len, 1)), 30cqh, 4rem); }
  .gloss { color: var(--muted); font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }
  .reveal { min-height: 4rem; text-wrap: balance; }
  .reveal .pair { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .reveal .how { color: var(--text); font-size: .9375rem; line-height: 1.45; }

  .receipt {
    width: 100%;
    max-width: 26rem;
    padding: .375rem .625rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: clamp(.875rem, 4.6cqw, 1rem);
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
    text-align: left;
  }
  .receipt .line {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 3.4em;
    gap: .5em;
    align-items: baseline;
    white-space: nowrap;
  }
  .receipt .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .receipt .ko { font-weight: 700; }
  .receipt .ja { margin-left: .4em; color: var(--muted); }
  .receipt .sub { text-align: right; }
  .receipt .sum {
    grid-template-columns: minmax(0, 1fr) auto;
    margin-top: .2rem;
    padding-top: .2rem;
    border-top: 1px dashed var(--muted);
    font-weight: 700;
  }

  .say {
    position: absolute;
    top: .25rem;
    right: .25rem;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    color: var(--text);
  }
  .listen { display: grid; gap: .375rem; width: 100%; max-width: 24rem; }
  .listen-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .375rem; }
  .listen-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .375rem;
    min-width: 0;
    min-height: 2.75rem;
    padding: .25rem;
    background: var(--sunken);
    border-radius: 10px;
    font-size: .9375rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .play { background: var(--accent); color: var(--on-accent); min-height: 3rem; font-size: 1.0625rem; }
  .play[data-on] { background: var(--accent-soft); color: var(--accent-text); }
  .listen.peeked .listen-row { display: none; }
  .listen-note { font-size: .875rem; line-height: 1.4; }

  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
  .quiz[data-shape="wide"] .options { grid-template-columns: minmax(0, 1fr); }
  .option {
    font-family: var(--display);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: clamp(3.5rem, 12dvh, 5.5rem);
    padding: .25rem .5rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: clamp(1.5rem, 7vw, 2rem);
    font-weight: 700;
    line-height: 1.15;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .quiz[data-shape="wide"] .option {
    min-height: clamp(2.875rem, 7.4dvh, 3.75rem);
    font-size: clamp(1.125rem, 5.2vw, 1.375rem);
  }
  .option::after {
    position: absolute;
    top: .375rem;
    right: .5rem;
    font-family: var(--sans);
    font-size: 1.125rem;
    font-weight: 700;
    line-height: 1;
  }
  .quiz[data-shape="wide"] .option::after { top: 50%; transform: translateY(-50%); }
  .option:disabled { cursor: default; color: var(--muted); }
  .option[data-state="correct"] { background: var(--good); border-color: var(--good); color: var(--on-good); }
  .option[data-state="wrong"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad-text); }
  .option[data-state="correct"]::after { content: "✓"; }
  .option[data-state="wrong"]::after { content: "×"; }
  .option[data-hit] { z-index: 1; animation: pop .26s ease; }
  @keyframes pop {
    0% { transform: scale(.96); }
    55% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .next, .action {
    min-height: 3.25rem;
    padding: .5rem 1rem;
    border-radius: var(--radius);
    font-size: 1.0625rem;
    font-weight: 700;
  }
  .next { width: 100%; background: var(--accent); color: var(--on-accent); }
  .next:disabled { visibility: hidden; }
  .action { width: 100%; background: var(--surface); border: 1.5px solid var(--line); }
  .action.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .export-text {
    width: 100%;
    height: 10rem;
    padding: 12px;
    background: var(--surface);
    color: inherit;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font: 1rem/1.5 var(--sans);
  }

  /* ── 結果画面・記録画面 ── */
  .result, .records {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
    max-width: 38rem;
    margin-inline: auto;
    padding-block: 1.25rem 1.5rem;
  }
  .score h2 {
    font-family: var(--display);
    font-size: clamp(2.75rem, 14vw, 4rem);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    line-height: 1.15;
  }
  .score p { color: var(--muted); font-size: 1rem; line-height: 1.55; }
  .score .cheer { color: var(--text); font-size: 1.125rem; font-weight: 700; }
  .cheer [lang="ko"] { color: var(--accent-text); font-family: var(--display); font-size: 1.5rem; }
  .actions { display: grid; gap: .5rem; }
  .stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: .5rem; }
  .stat {
    display: grid;
    align-content: start;
    min-width: 0;
    padding: .5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    line-height: 1.3;
  }
  .stat .label { color: var(--muted); font-size: .875rem; font-weight: 700; white-space: nowrap; }
  .stat .value { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .stat .sub { color: var(--muted); font-size: .875rem; }

  .scraps { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .scraps:empty { display: none; }
  .scrap {
    display: grid;
    grid-template-columns: 1.25rem minmax(0, 1fr);
    column-gap: .625rem;
    align-items: center;
    padding: .5rem .75rem;
  }
  .scrap + .scrap { border-top: 1px solid var(--line); }
  .scrap::before { content: "✓"; grid-row: 1 / span 2; color: var(--good-text); font-weight: 700; }
  .scrap.missed::before { content: "×"; color: var(--bad-text); }
  .scrap .word { font-family: var(--display); font-size: 1.125rem; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .scrap .num { color: var(--muted); font-size: .9375rem; line-height: 1.35; }

  .records-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .records-head h2 { font-size: 1.5rem; font-weight: 700; }
  .text-button { min-height: 2.75rem; padding-inline: .5rem 0; color: var(--accent-text); font-size: 1rem; font-weight: 700; }
  .record-lists { display: grid; gap: 1rem; min-width: 0; }
  .list-block { display: grid; gap: .25rem; min-width: 0; }
  .list-block h3 { color: var(--muted); font-size: .9375rem; font-weight: 700; }
  .rows { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .rows li {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .75rem;
    align-items: baseline;
    padding: .5rem .75rem;
    font-size: 1rem;
    line-height: 1.4;
  }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows b { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .rows small { display: block; color: var(--muted); font-size: .875rem; }
  .rows .empty { display: block; color: var(--muted); font-size: .9375rem; }
  #erase { color: var(--bad-text); }
  #erase[data-armed] { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }

  /* 正解のときに広がる小さな丸 */
  .burst { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  .fly {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2);
    background: var(--red);
    border-radius: 50%;
  }
  .fly.blue { background: var(--blue); }
  .fly.gold { background: var(--yellow); }

  /* ── 広い画面：ホームは左右2列 ── */
  @media (min-width: 56rem) {
    .start { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 62rem; column-gap: 2rem; padding-block: 2.5rem; }
    .start-head { grid-column: 1 / -1; }
    .result, .records { padding-block: 2.5rem; }
    .record-lists { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .records { max-width: 52rem; }
    .quiz { padding-block: 1rem 1.5rem; }
  }

  /* ── 小さいスマホ ── */
  @media (max-height: 40rem) and (orientation: portrait) {
    .quiz { gap: .375rem; padding-bottom: .5rem; }
    .quiz[data-shape="wide"] .option { min-height: 2.75rem; }
    .next { min-height: 2.875rem; }
    .question { padding-block: .5rem; }
    .prompt.verdict { font-size: 1.25rem; }
    .receipt { padding-block: .125rem; line-height: 1.3; }
    .receipt .sum { margin-top: .125rem; padding-top: .125rem; }
  }

  /* ── スマホの横向き：左に問題、右に選択肢 ── */
  @media (orientation: landscape) and (max-height: 30rem) {
    .start { grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); max-width: none; column-gap: 1.25rem; padding-block: .75rem; }
    .start-head { grid-column: 1 / -1; }
    .quiz {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: .375rem .75rem;
      max-width: none;
      min-height: 17rem;
      padding-block: .25rem .5rem;
    }
    .bar { grid-column: 1; grid-row: 1; }
    .question { grid-column: 1; grid-row: 2 / span 2; padding-block: .5rem; }
    .options, .quiz[data-shape="wide"] .options { grid-column: 2; grid-row: 1 / span 2; grid-auto-rows: 1fr; }
    .option, .quiz[data-shape="wide"] .option { min-height: 2.75rem; }
    .quiz[data-shape="wide"] .option { font-size: clamp(1rem, 3.1vw, 1.375rem); }
    .next { grid-column: 2; grid-row: 3; min-height: 2.75rem; }
    .result, .records { max-width: 44rem; }
    .receipt { padding-block: .125rem; line-height: 1.3; }
    .receipt .sum { margin-top: .125rem; padding-top: .125rem; }
    .prompt.verdict { font-size: 1.25rem; }
  }

  @media (hover: hover) {
    .mode:hover:enabled { background: var(--accent-soft); }
    .option:hover:enabled, .action:hover, .choice:hover, .secondary:hover, .card:hover { border-color: var(--accent); }
    .next:hover, .listen-btn:hover, .primary:hover { filter: brightness(1.08); }
  }
  button:active:enabled { filter: brightness(.95); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

    { id: 'spicy', dict: '맵다', ja: '辛い', polite: '辛いです', why: WARP, present: '매워요|맵어요|맵아요|매와요' },
    { id: 'easy', dict: '쉽다', ja: '易しい', polite: '易しいです', why: WARP, present: '쉬워요|쉽어요|쉽아요|쉬와요' },
    { id: 'hard', dict: '어렵다', ja: '難しい', polite: '難しいです', why: WARP, present: '어려워요|어렵어요|어렵아요|어려와요' },
    {
      id: 'live', dict: '살다', ja: '住む', polite: '住んでいます', why: '살 + 아요 → 살아요。사요（買います）とは別の言葉です', lost: LOST,

    { id: 'hear', dict: '듣다', ja: '聞く', polite: '聞きます', why: 'ㄷがㄹに変わります', present: '들어요|듣어요|듣아요|드러요' },
    { id: 'busy', dict: '바쁘다', ja: '忙しい', polite: '忙しいです', why: 'ㅡが消えて 아요 がつきます', present: '바빠요|바쁘아요|바쁘어요|바뻐요' },
    { id: 'hurt', dict: '아프다', ja: '痛い', polite: '痛いです', why: 'ㅡが消えて 아요 がつきます', present: '아파요|아프아요|아프어요|아퍼요' },
  ];

  const verbById = id => [...VERBS, ...HARD_WORDS].find(verb => verb.id === id);
  const stemOf = verb => verb.dict.slice(0, -1);

  // 「〜したい」は全部同じ作り方なので、表に書かずに組み立てる
  function formsOf(verb, form) {
    if (form !== 'want') return verb[form].split('|');
    const stem = stemOf(verb);
    return [
      `${stem}고 싶어요`, `${stem}고 싶아요`, `${stem}고 십어요`,
      verb.past.split('|')[0].replace('어요', '고 싶어요'),
    ];
  }
  const formOf = (verb, form) => formsOf(verb, form)[0];
  const missOf = (verb, form) => formsOf(verb, form).slice(1);

  function verbJa(verb, form) {
    if (verb.polite) return verb.polite;
    const { ja, stem } = verb;
    return {
      present: `${stem}ます`, formal: `${stem}ます`, past: `${stem}ました`,
      neg: `${stem}ません`, want: `${stem}たいです`, plan: `${ja}つもりです`,
    }[form];
  }

  // 聞いて意味を選ぶ問題で、同じ動詞の別の形も選択肢に入れる。習っていない形は入れない
  const NEAR_FORM = { past: 'present', neg: 'present', want: 'plan', plan: 'want' };

  // 数と動詞を組み合わせた文で使える言葉
  const LINE_ITEMS = {
    drink: ['coffee', 'tea', 'juice', 'beer', 'soju', 'water'],
    eat: ['apple', 'mandarin', 'bread', 'egg'],
    buy: ['book', 'magazine', 'ticket', 'apple', 'bread', 'beer'],
    read: ['book', 'magazine'],

    meet: ['friend', 'student'],
  };
  const CLOCK_VERBS = ['go', 'come', 'eat', 'sleep', 'meet', 'study'];

  // コンビニの商品。値段は練習用の目安
  const GOODS = [
    { id: 'kimbap', ko: '삼각김밥', ja: '三角おにぎり', price: 1200 },
    { id: 'ramen', ko: '컵라면', ja: 'カップ麺', price: 1500 },
    { id: 'banana', ko: '바나나우유', ja: 'バナナ牛乳', price: 1700 },

  // レジで使う言い回し
  const PHRASES = {

  // コンビニ4から使う言い回し
  const MORE_PHRASES = {
    closing: { ask: '何時までか聞きたい', ko: '몇 시까지 해요?', how: '몇 시 = 何時、까지 = 〜まで' },

    hasBag: { ask: '袋があるか聞きたい', ko: '봉투 있어요?', how: '봉투 = 袋、있어요 = あります' },

  // 店員さんがよく言う言葉
  const STAFF = {
    welcome: { ko: '어서 오세요', ja: 'いらっしゃいませ' },
    bag: { ko: '봉투 필요하세요?', ja: '袋は必要ですか' },
    point: { ko: '포인트 카드 있으세요?', ja: 'ポイントカードはありますか' },
    heat: { ko: '데워 드릴까요?', ja: '温めましょうか' },
    receipt: { ko: '영수증 드릴까요?', ja: 'レシートはいりますか' },
    bye: { ko: '안녕히 가세요', ja: 'さようなら' },
  };

  // 字面や響きが似ていて取り違えやすい組み合わせ
  const LOOK_NATIVE = {
    1: [2], 2: [1, 3], 3: [4, 2], 4: [3, 5], 5: [6, 4], 6: [5, 8, 10], 7: [9, 8], 8: [6, 10], 9: [7, 8],
    10: [6, 8, 20], 20: [10, 30], 30: [20, 80], 40: [70, 90], 50: [60, 40],
    60: [50, 80], 70: [40, 90], 80: [30, 60, 90], 90: [40, 70, 80],
  };
  const LOOK_SINO = {
    1: [2, 7, 8], 2: [1, 4], 3: [4, 10], 4: [3, 10], 5: [9, 2],
    6: [9, 1], 7: [1, 8], 8: [7, 1], 9: [6, 5], 10: [4, 3],
  };

  const range = (from, to, step = 1) =>
    Array.from({ length: Math.floor((to - from) / step) + 1 }, (_, i) => from + i * step);

  const ROUND_BIG = [...range(100, 900, 100), ...range(1000, 9000, 1000), ...range(10000, 90000, 10000)];

  function shuffle(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const sample = (list, count) => shuffle(list).slice(0, count);
  const pickOne = list => list[Math.floor(Math.random() * list.length)];

  /* ━━ 3. 間違いの選択肢 ━━ */

  const poolOf = n => (n <= 10 ? range(1, 10) : n < 100 ? range(10, 99) : ROUND_BIG);

  // pool：選択肢に出してよい数。習っていない言葉を混ぜないために、レベルごとに絞る
  function wrongNumbers(sys, n, pool = poolOf(n)) {
    const native = sys === 'native';
    const table = native ? LOOK_NATIVE : LOOK_SINO;
    const ten = n - n % 10;
    const one = n % 10;
    const close = [];
    const related = [];

    if (n >= 100) {
      const unit = 10 ** (String(n).length - 1);
      const lead = n / unit;
      close.push(...LOOK_SINO[lead].filter(x => x < 10).map(x => x * unit), n * 10, n / 10);
      related.push(...range(1, 9).map(x => x * unit));
    } else if (ten && one) {
      for (const x of table[one]) if (x < 10) close.push(ten + x);
      if (native) {
        for (const x of table[ten]) if (x % 10 === 0) close.push(x + one);
      } else {
        for (const x of table[ten / 10]) if (x < 10) close.push(x * 10 + one);
        close.push(one * 10 + ten / 10); // 27と72のように位を取り違える
      }
      related.push(...range(1, 9).map(x => ten + x), ...range(1, 9).map(x => x * 10 + one));
    } else {
      close.push(...(table[n] ?? table[n / 10].map(x => x * 10)));
      related.push(...(one ? range(1, 9) : range(10, 90, 10)));
    }

    const wrong = [];
    for (const tier of [shuffle(close).slice(0, 2), shuffle(related), shuffle(pool)]) {
      for (const x of tier) {
        if (x !== n && pool.includes(x) && !wrong.includes(x)) wrong.push(x);
      }
    }
    return wrong;
  }

  function closePrices(n, max = 100000) {
    const unit = 10 ** (String(n).length - 1);
    const lead = Math.floor(n / unit);
    const nextUnit = unit / 10;
    const second = Math.floor(n / nextUnit) % 10;
    const near = LOOK_SINO[lead].filter(x => x < 10).map(x => n + (x - lead) * unit);
    if (second) near.push(...LOOK_SINO[second].filter(x => x < 10).map(x => n + (x - second) * nextUnit));
    near.push(n + unit, n - unit, n * 10, n + nextUnit);
    return shuffle([...new Set(near)]).filter(x => x > 0 && x !== n && x % 100 === 0 && x < max);
  }

  // 値段を固有数詞で言ってしまった形（実際には使わない言い方）
  function priceInNative(n) {
    const man = Math.floor(n / 10000);
    const cheon = Math.floor(n / 1000) % 10;
    const baek = Math.floor(n / 100) % 10;
    const parts = [];
    if (man) parts.push(`${nativeBeforeUnit(man)}만`);
    const rest = (cheon ? `${nativeBeforeUnit(cheon)}천` : '') + (baek ? `${nativeBeforeUnit(baek)}백` : '');
    if (rest) parts.push(rest);
    return `${parts.join(' ')} 원`;
  }

  function wrongDates(m, d) {
    const months = (m <= 10 ? LOOK_SINO[m] : m === 11 ? [12, 1] : [11, 2]).filter(x => x <= 12 && d <= DAYS_IN_MONTH[x - 1]);
    const days = wrongNumbers('sino', d).filter(x => x <= 28).slice(0, 4);
    return shuffle([...months.map(x => [x, d]), ...days.map(x => [m, x])]);
  }

  function choiceSet(right, wrongs, lang) {
    const picked = [...new Set(wrongs)].filter(text => text !== right).slice(0, 3);
    return shuffle([
      { text: right, lang, right: true },
      ...picked.map(text => ({ text, lang, right: false })),
    ]);
  }

  /* ━━ 4. 問題を組み立てる ━━
     spec は問題の中身だけを持つ小さな記録。build(spec) で画面に出す形にする。 */

  function placeValues(n) {

  function howToRead(sys, n) {
    const reading = (sys === 'native' ? READ_NATIVE : READ_SINO)[n];

    return { text: placeValues(n).map(p => `${wordOf(p)} ${fmt(p)}`).join(' + '), lang: 'ko' };
  }

  function buildNumber({ sys, n, listen, pool }) {
    const wordOf = sys === 'native' ? nativeWord : sinoWord;
    const word = wordOf(n);
    const wrong = pool ? wrongNumbers(sys, n, range(...pool)) : wrongNumbers(sys, n);
    const base = {
      key: `num:${sys}:${n}`,
      word,
      note: fmt(n),
      say: word,
      pair: `${fmt(n)} = ${word}`,

    if (listen) {
      return { ...base, prompt: '聞こえた数はどれ？', choices: choiceSet(fmt(n), wrong.map(fmt), 'ja') };

    return {
      ...base,

      show: { text: fmt(n), lang: 'ja' },

  // early：まだ「いち、に、さん」の数え方を習っていない段階。その言葉を選択肢に出さない
  function buildCounter({ item: id, n, ask, listen, early }) {

    const wrongForms = [
      ...(plain === form ? [] : [koOf(plain)]),
      ...(early ? [] : [koOf(sinoWord(n))]),
      ...others.map(x => koOf(nativeBeforeUnit(x))),

    return { ...base, prompt: '韓国語で言うと？', show: { text: ja, lang: 'ja' }, choices: choiceSet(word, wrongForms, 'ko') };

  function buildPrice({ n, listen, max }) {

    const word = dateWord(m, d);

  function buildTotal({ cart, listen, max }) {
    const lines = cart.map(([id, qty]) => ({ good: goodById(id), qty }));

  // 「봉투 두 개 주세요」の形。数の間違いをいくつか混ぜる。askOf は数から日本語の文を作る
  function buildAsk({ key, koName, n, askOf, how, listen, early, unit = '개' }) {
    const say = word => `${koName} ${word} ${unit} 주세요`;
    const word = say(nativeBeforeUnit(n));

    return {
      ...base,
      prompt: 'レジで何と言う？',
      show: { text: askOf(n), lang: 'ja' },
      choices: choiceSet(word, [
        say(nativeWord(n)),
        ...(early ? [] : [say(sinoWord(n))]),

  const buildBag = ({ n, listen, early }) => buildAsk({
    key: `bag:${n}`, koName: '봉투', n, listen, early,

    const unitJa = unitsOf(item.c)[item.c];

  function buildPhrase({ id }) {
    const group = id in PHRASES ? PHRASES : MORE_PHRASES;
    const phrase = group[id];
    const others = Object.values(group).filter(other => other !== phrase).map(other => other.ko);
    return {
      key: `phrase:${id}`,
      word: phrase.ko,
      note: phrase.ask,
      say: phrase.ko,
      pair: phrase.ko,
      how: { text: phrase.how },
      prompt: group === PHRASES ? 'レジで何と言う？' : 'お店で何と言う？',
      show: { text: phrase.ask, lang: 'ja' },
      choices: choiceSet(phrase.ko, shuffle(others), 'ko'),
    };
  }

  function buildStaff({ id, listen }) {
    const line = STAFF[id];
    const others = shuffle(Object.values(STAFF).filter(other => other !== line)).map(other => other.ja);
    const base = {
      key: `staff:${id}`,
      word: line.ko,
      note: line.ja,
      say: line.ko,
      pair: `${line.ja} = ${line.ko}`,
      how: { text: '店員さんがよく使う言い方です' },
      choices: choiceSet(line.ja, others, 'ja'),
    };
    if (listen) return { ...base, prompt: '店員さんは何と言った？' };
    return { ...base, prompt: '店員さんの言葉の意味は？', show: { text: line.ko, lang: 'ko' } };
  }

  // 時刻：時は固有数詞、分は漢数詞。half は「半」を使う言い方
  function buildTime({ h, m = 0, half, listen }) {
    const count = nativeBeforeUnit(h);
    const plain = nativeWord(h);
    const minuteOn = Boolean(m) && !half;
    const tail = half ? ' 반' : minuteOn ? ` ${minuteWord(m)}` : '';
    const jaTail = half ? '半' : minuteOn ? `${m}分` : '';
    const say = hour => `${hour} 시${tail}`;
    const jaOf = x => `${x}時${jaTail}`;
    const word = say(count);
    const hours = wrongNumbers('native', h, range(1, 12));
    const minutes = minuteOn ? wrongNumbers('sino', m, range(5, 55, 5)).slice(0, 2) : [];
    const changed = plain === count ? '' : `시の前で ${plain} → ${count}。`;
    const base = {
      key: `time:${h}:${half ? 'half' : m}`,
      word,
      note: jaOf(h),
      say: word,
      pair: `${jaOf(h)} = ${word}`,
      how: { text: `${changed}時は「ひとつ」の数え方${minuteOn ? '、分は「いち」の数え方' : ''}です` },
    };
    if (listen) {
      const near = [...minutes.map(x => `${h}時${x}分`), ...hours.map(jaOf)];
      return { ...base, prompt: '聞こえた時刻はどれ？', choices: choiceSet(jaOf(h), near, 'ja') };
    }
    return {
      ...base,
      prompt: '時刻の言い方は？',
      show: { text: jaOf(h), lang: 'ja' },
      choices: choiceSet(word, [
        ...(minuteOn ? [`${count} 시 ${nativeBeforeUnit(m)} 분`] : []),
        say(sinoWord(h)),
        ...(plain === count ? [] : [say(plain)]),
        ...minutes.map(x => `${count} 시 ${minuteWord(x)}`),
        ...hours.map(x => say(nativeBeforeUnit(x))),
      ], 'ko'),
    };
  }

  function buildAge({ n, listen }) {
    const count = nativeBeforeUnit(n);
    const plain = nativeWord(n);
    const word = `${count} 살`;
    const jaOf = x => `${x}歳`;
    const others = wrongNumbers('native', n);
    const base = {
      key: `age:${n}`,
      word,
      note: jaOf(n),
      say: word,
      pair: `${jaOf(n)} = ${word}`,
      how: { text: `年齢は「ひとつ」の数え方です${plain === count ? '' : `。살の前で ${plain} → ${count}`}` },
    };
    if (listen) return { ...base, prompt: '聞こえた年齢はどれ？', choices: choiceSet(jaOf(n), others.map(jaOf), 'ja') };
    return {
      ...base,
      prompt: '年齢の言い方は？',
      show: { text: jaOf(n), lang: 'ja' },
      choices: choiceSet(word, [
        ...(plain === count ? [] : [`${plain} 살`]),
        `${sinoWord(n)} 살`,
        ...others.map(x => `${nativeBeforeUnit(x)} 살`),
      ], 'ko'),
    };
  }

  // 「〜です」の材料。slips は数の言い方を間違えた形
  function beParts({ noun, hour, age, won, item: id, n }) {
    if (noun) {
      const { ko, ja } = NOUNS.find(entry => entry.id === noun);
      const others = shuffle(NOUNS.filter(entry => entry.id !== noun));
      return { ko, ja, slips: [], wrongJa: others.map(entry => entry.ja) };
    }
    if (hour) {
      const near = wrongNumbers('native', hour, range(1, 12));
      return {
        ko: hourWord(hour), ja: `${hour}時`,
        slips: [`${sinoWord(hour)} 시`], wrongJa: near.map(x => `${x}時`),
      };
    }
    if (age) {
      return {
        ko: `${nativeBeforeUnit(age)} 살`, ja: `${age}歳`,
        slips: [`${sinoWord(age)} 살`], wrongJa: wrongNumbers('native', age).map(x => `${x}歳`),
      };
    }
    if (won) {
      return {
        ko: priceWord(won), ja: `${fmt(won)}ウォン`,
        slips: [priceInNative(won)], wrongJa: closePrices(won).map(x => `${fmt(x)}ウォン`),
      };
    }
    const item = itemById(id);
    const unitJa = unitsOf(item.c)[item.c];
    return {
      ko: `${item.ko} ${nativeBeforeUnit(n)} ${item.c}`, ja: `${item.ja} ${n}${unitJa}`,
      slips: [`${item.ko} ${sinoWord(n)} ${item.c}`],
      wrongJa: wrongNumbers('native', n).map(x => `${item.ja} ${x}${unitJa}`),
    };
  }

  // 받침 のあとに 예요 は続かず、받침 がなければ 이에요 は使わない。이예요 と 에요 はつづりの間違い
  const beMistakes = word => (hasFinal(word) ? [`${word}예요`] : [`${word}이에요`]).concat(`${word}이예요`, `${word}에요`);

  function buildBe(spec) {
    const { ko, ja, slips, wrongJa } = beParts(spec);
    const { ask, listen } = spec;
    const word = politeBe(ko);
    const jaBe = `${ja}です`;
    const ending = word.slice(ko.length);
    const name = spec.noun || spec.hour || spec.age || spec.won || `${spec.item}${spec.n}`;
    const base = {
      key: `be:${name}:${ask}`,
      word,
      note: jaBe,
      say: word,
      pair: `${jaBe} = ${word}`,
      how: { text: `${ko} の最後の文字に${hasFinal(ko) ? 'パッチムがあるので 이에요' : 'パッチムがないので 예요'}` },
    };
    if (listen) return { ...base, prompt: '聞こえた文の意味は？', choices: choiceSet(jaBe, wrongJa.map(x => `${x}です`), 'ja') };
    if (ask === 'blank') {
      return {
        ...base,
        prompt: '□に入る形は？',
        show: { text: `${ko} □`, lang: 'ko' },
        gloss: jaBe,
        choices: choiceSet(ending, ['이에요', '예요', '이예요', '에요'], 'ko'),
      };
    }
    return {
      ...base,
      prompt: '韓国語で言うと？',
      show: { text: jaBe, lang: 'ja' },
      choices: choiceSet(word, [...slips.map(politeBe), ...beMistakes(ko)], 'ko'),
    };
  }

  function howOfForm(verb, form) {
    const stem = stemOf(verb);
    if (verb.polite) return form === 'formal' ? verb.lost : verb.why;
    const present = formOf(verb, 'present');
    return {
      present: verb.join ? `${stem} + ${verb.join} → ${present}` : `하다 は 해요 になります`,
      past: `${present} の요を取って ㅆ어요 をつけます`,
      formal: hasFinal(stem) ? `${stem} にパッチムがあるので 습니다` : `パッチムがないので ㅂ니다`,
      neg: verb.id === 'study' ? '공부 と 해요 の間に 안 を入れます' : '動詞の前に 안 を置きます',
      want: '다 を取って 고 싶어요 をつけます',
      plan: hasFinal(stem) ? `${stem} にパッチムがあるので 을 거예요` : 'パッチムがないので ㄹ 거예요',
    }[form];
  }

  const FORM_ASK = {
    present: '「〜ます」の形は？', past: '「〜ました」の形は？', formal: 'かしこまった形は？',
    neg: '「〜ません」の形は？', want: '「〜たい」の形は？', plan: '「〜つもり」の形は？',
  };

  // ask：make は基本の形から作る、read は意味を選ぶ
  function buildVerb({ id, form, ask = 'make', listen }) {
    const verb = verbById(id);
    const word = formOf(verb, form);
    const ja = verbJa(verb, form);
    const near = NEAR_FORM[form] && !verb.polite ? [verbJa(verb, NEAR_FORM[form])] : [];
    const others = shuffle((verb.polite ? HARD_WORDS : VERBS).filter(other => other !== verb)).map(other => verbJa(other, form));
    const meanings = choiceSet(ja, [...near, ...others], 'ja');
    const base = {
      key: `verb:${id}:${form}:${ask}`,
      word,
      note: ja,
      say: word,
      pair: `${ja} = ${word}`,
      how: { text: howOfForm(verb, form) },
    };
    if (listen) return { ...base, prompt: '聞こえた言葉の意味は？', choices: meanings };
    if (ask === 'read') return { ...base, prompt: 'どういう意味？', show: { text: word, lang: 'ko' }, choices: meanings };
    const label = form === 'formal' ? `${ja}（かしこまった言い方）` : ja;
    return {
      ...base,
      prompt: verb.polite && form === 'present' ? '丁寧な形は？' : FORM_ASK[form],
      show: { text: verb.dict, lang: 'ko' },
      gloss: `${verb.ja} → ${label}`,
      choices: choiceSet(word, missOf(verb, form), 'ko'),
    };
  }

  // 「커피 두 잔 마셔요」のように、数と動詞を組み合わせた文の材料
  function lineParts({ item: itemId, verb: verbId, n, form }) {
    const item = itemById(itemId);
    const verb = verbById(verbId);
    const unitJa = unitsOf(item.c)[item.c];
    const mark = verbId === 'meet' ? 'に' : 'を';
    const bare = form === 'neg'; // 「2杯飲みません」は不自然なので、否定の文には数を入れない
    const head = x => (bare ? item.ko : `${item.ko} ${x} ${item.c}`);
    const jaHead = x => `${item.ja}${mark}${bare ? '' : `${x}${unitJa}`}`;
    const count = nativeBeforeUnit(n);
    const plain = nativeWord(n);
    const right = formOf(verb, form);
    const miss = missOf(verb, form);
    const others = wrongNumbers('native', n);
    const sameVerb = LINE_ITEMS[verbId].filter(other => other !== itemId).map(other => `${itemById(other).ja}${mark}${verbJa(verb, form)}`);
    return {
      verb,
      head: head(count),
      ko: `${head(count)} ${right}`,
      ja: `${jaHead(n)}${verbJa(verb, form)}`,
      wrong: bare ? miss.map(x => `${item.ko} ${x}`) : [
        ...(plain === count ? [] : [`${head(plain)} ${right}`]),
        `${head(sinoWord(n))} ${right}`,
        `${head(count)} ${miss[0]}`,
        ...others.map(x => `${head(nativeBeforeUnit(x))} ${right}`),
      ],
      wrongJa: [
        ...(NEAR_FORM[form] ? [`${jaHead(n)}${verbJa(verb, NEAR_FORM[form])}`] : []),
        ...(bare
          ? [...sameVerb, `${jaHead(n)}${verbJa(verb, 'past')}`, `${jaHead(n)}${verbJa(verb, 'want')}`]
          : others.map(x => `${jaHead(x)}${verbJa(verb, form)}`)),
      ],
    };
  }

  function buildLine(spec) {
    const { item, verb: verbId, n, form, ask, listen } = spec;
    const { verb, head, ko, ja, wrong, wrongJa } = lineParts(spec);
    const base = {
      key: `line:${verbId}:${item}:${n}:${form}:${ask}`,
      word: ko,
      note: ja,
      say: ko,
      pair: `${ja} = ${ko}`,
      how: { text: howOfForm(verb, form) },
    };
    if (listen) return { ...base, prompt: '聞こえた文の意味は？', choices: choiceSet(ja, wrongJa, 'ja') };
    if (ask === 'blank') {
      return {
        ...base,
        prompt: '□に入る形は？',
        show: { text: `${head} □`, lang: 'ko' },
        gloss: ja,
        choices: choiceSet(formOf(verb, form), missOf(verb, form), 'ko'),
      };
    }
    return { ...base, prompt: '韓国語で言うと？', show: { text: ja, lang: 'ja' }, choices: choiceSet(ko, wrong, 'ko') };
  }

  // 「세 시에 가요」のように、時刻のあとに言葉が続く文
  function buildHourLine({ key, h, after, jaAfter, miss = [], how, listen }) {
    const say = hour => `${hour}${after}`;
    const jaOf = x => `${x}時${jaAfter}`;
    const word = say(hourWord(h));
    const near = wrongNumbers('native', h, range(1, 12));
    const count = nativeBeforeUnit(h);
    const plain = nativeWord(h);
    const base = { key, word, note: jaOf(h), say: word, pair: `${jaOf(h)} = ${word}`, how: { text: how } };
    if (listen) return { ...base, prompt: '聞こえた文の意味は？', choices: choiceSet(jaOf(h), near.map(jaOf), 'ja') };
    return {
      ...base,
      prompt: '韓国語で言うと？',
      show: { text: jaOf(h), lang: 'ja' },
      choices: choiceSet(word, [
        say(`${sinoWord(h)} 시`),
        ...(plain === count ? [] : [say(`${plain} 시`)]),
        ...miss,
        ...near.map(x => say(hourWord(x))),
      ], 'ko'),
    };
  }

  function buildClock({ h, verb: verbId, form, listen }) {
    const verb = verbById(verbId);
    return buildHourLine({
      key: `clock:${h}:${verbId}:${form}`, h, listen,
      after: `에 ${formOf(verb, form)}`,
      jaAfter: `に${verbJa(verb, form)}`,
      miss: missOf(verb, form).slice(0, 1).map(x => `${hourWord(h)}에 ${x}`),
      how: `에 = 〜に。${howOfForm(verb, form)}`,
    });
  }

  const buildHours = ({ h, listen }) => buildHourLine({
    key: `hours:${h}`, h, listen, after: '까지 해요', jaAfter: 'までです', how: '까지 = 〜まで、해요 = します',
  });

  // 会話：質問への答え。number は年齢や人数のように「ひとつ」の数え方で答えるもの
  function numberAnswer(unit, jaUnit, n) {
    const count = nativeBeforeUnit(n);
    const plain = nativeWord(n);
    const ko = `${count} ${unit}`;
    return {
      ko: politeBe(ko),
      ja: `${n}${jaUnit}です`,
      wrong: [
        ...(plain === count ? [] : [politeBe(`${plain} ${unit}`)]),
        politeBe(`${sinoWord(n)} ${unit}`),
        `${ko}예요`,
        ...wrongNumbers('native', n).map(x => politeBe(`${nativeBeforeUnit(x)} ${unit}`)),
      ],
      wrongJa: wrongNumbers('native', n).map(x => `${x}${jaUnit}です`),
      how: `${unit} の前は「ひとつ」の数え方です`,
    };
  }

  function lineAnswer(spec, slipForm) {
    const { verb, head, ko, ja, wrong, wrongJa } = lineParts(spec);
    return { ko, ja, wrong: [`${head} ${formOf(verb, slipForm)}`, ...wrong], wrongJa, how: howOfForm(verb, spec.form) };
  }

  const TALKS = {
    hour: ({ n }) => ({
      ask: '지금 몇 시예요?', askJa: '今何時ですか',
      ko: politeBe(hourWord(n)), ja: `${n}時です`,
      wrong: [politeBe(`${sinoWord(n)} 시`), `${hourWord(n)}이에요`, `${hourWord(n)}에요`, ...wrongNumbers('native', n, range(1, 12)).map(x => politeBe(hourWord(x)))],
      wrongJa: wrongNumbers('native', n, range(1, 12)).map(x => `${x}時です`),
      how: '時は「ひとつ」の数え方です',
    }),
    age: ({ n }) => ({ ask: '몇 살이에요?', askJa: '何歳ですか', ...numberAnswer('살', '歳', n) }),
    people: ({ n }) => ({ ask: '몇 명이에요?', askJa: '何人ですか', ...numberAnswer('명', '人', n) }),
    price: ({ n }) => ({
      ask: '얼마예요?', askJa: 'いくらですか',
      ko: politeBe(priceWord(n)), ja: `${fmt(n)}ウォンです`,
      wrong: [politeBe(priceInNative(n)), `${priceWord(n)}예요`, ...closePrices(n).map(x => politeBe(priceWord(x)))],
      wrongJa: closePrices(n).map(x => `${fmt(x)}ウォンです`),
      how: '値段は「いち」の数え方です',
    }),
    did: spec => ({ ask: '어제 뭐 했어요?', askJa: '昨日、何をしましたか', ...lineAnswer({ ...spec, form: 'past' }, 'present') }),
    plan: spec => ({ ask: '내일 뭐 할 거예요?', askJa: '明日、何をするつもりですか', ...lineAnswer({ ...spec, form: 'plan' }, 'past') }),
    want: spec => ({ ask: '뭐 하고 싶어요?', askJa: '何がしたいですか', ...lineAnswer({ ...spec, form: 'want' }, 'plan') }),
    no({ item: itemId, verb: verbId }) {
      const item = itemById(itemId);
      const verb = verbById(verbId);
      const others = shuffle(VERBS.filter(other => other !== verb)).map(other => `いいえ、${verbJa(other, 'neg')}`);
      return {
        ask: `${item.ko} ${formOf(verb, 'present')}?`, askJa: `${item.ja}を${verbJa(verb, 'present')}か`,
        ko: `아니요, ${formOf(verb, 'neg')}`, ja: `いいえ、${verbJa(verb, 'neg')}`,
        wrong: missOf(verb, 'neg').map(x => `아니요, ${x}`),
        wrongJa: [`はい、${verbJa(verb, 'present')}`, ...others],
        how: howOfForm(verb, 'neg'),
      };
    },
    weather({ word }) {
      const verb = verbById(word);
      return {
        ask: '오늘 날씨 어때요?', askJa: '今日の天気はどうですか',
        ko: formOf(verb, 'present'), ja: verb.polite,
        wrong: missOf(verb, 'present'),
        wrongJa: shuffle(HARD_WORDS.filter(other => other !== verb)).map(other => other.polite),
        how: verb.why,
      };
    },
    sleep({ n }) {
      const near = wrongNumbers('native', n, range(1, 12));
      return {
        ask: '몇 시에 자요?', askJa: '何時に寝ますか',
        ko: `${hourWord(n)}에 자요`, ja: `${n}時に寝ます`,
        wrong: [`${sinoWord(n)} 시에 자요`, `${hourWord(n)}에 자아요`, ...near.map(x => `${hourWord(x)}에 자요`)],
        wrongJa: near.map(x => `${x}時に寝ます`),
        how: '時は「ひとつ」の数え方、에 = 〜に',
      };
    },
  };

  function buildTalk(spec) {
    const { ask, askJa, ko, ja, wrong, wrongJa, how } = TALKS[spec.id](spec);
    const name = [spec.id, spec.n, spec.item, spec.verb, spec.word].filter(Boolean).join(':');
    const base = {
      key: `talk:${name}`,
      word: ko,
      note: ja,
      say: ko,
      pair: `${ja} = ${ko}`,
      how: { text: `${ask} = ${askJa}。${how}` },
    };
    if (spec.listen) return { ...base, prompt: '聞こえた答えの意味は？', choices: choiceSet(ja, wrongJa, 'ja') };
    return { ...base, prompt: 'どう答える？', show: { text: ask, lang: 'ko' }, gloss: `「${ja}」と答える`, choices: choiceSet(ko, wrong, 'ko') };
  }

  const BUILDERS = {
    num: buildNumber, cnt: buildCounter, price: buildPrice, date: buildDate,
    total: buildTotal, bag: buildBag, buy: buildBuy, phrase: buildPhrase,
    order: buildOrder, staff: buildStaff, time: buildTime, age: buildAge, be: buildBe,
    verb: buildVerb, line: buildLine, clock: buildClock, hours: buildHours, talk: buildTalk,
  };

  function build(spec) {
    const q = BUILDERS[spec.t](spec);
    if (spec.listen) q.key += ':listen';
    return { ...q, listen: Boolean(spec.listen), spec };
  }

  /* ━━ 5. 1回分の問題を選ぶ ━━ */

  // 同じものが重ならないように count 個作る
  function distinct(count, make) {
    const found = new Map();
    while (found.size < count) {
      const value = make();
      found.set(JSON.stringify(value), value);
    }
    return [...found.values()];
  }

  // 同じ数が続くと答えが読めてしまうので、離れるまで並べ直す
  function spaced(specs) {
    let list = shuffle(specs);
    for (let tries = 0; tries < 50 && list.some((spec, i) => i && spec.n === list[i - 1].n); tries++) {
      list = shuffle(specs);
    }
    return list;
  }

  const numberSpecs = (sys, list, pool) => list.map(n => ({ t: 'num', sys, n, ...(pool && { pool }) }));
  const priceSpecs = (list, max) => list.map(n => ({ t: 'price', n, ...(max && { max }) }));
  const readAndListen = specs => specs.flatMap(spec => [spec, { ...spec, listen: true }]);
  const someListening = (specs, count) => shuffle(specs).map((spec, i) => (i < count ? { ...spec, listen: true } : spec));
  const halfListening = specs => someListening(specs, specs.length / 2);

  // 2桁は 스물・서른 や 이십・삼십 の十の位を覚えないと読めないので、切りのいい数を必ず混ぜる
  const twoDigits = (rounds, others) => [
    ...sample(range(20, 90, 10), rounds),
    ...sample(range(21, 99).filter(n => n % 10), others),
  ];

  function countSpecs(numbers, asks, early, unitTable = UNITS, itemList = ITEMS) {
    const units = shuffle(Object.keys(unitTable));
    const items = units.map(unit => shuffle(itemList.filter(item => item.c === unit)));
    const order = shuffle(asks);
    return numbers.map((n, i) => ({
      t: 'cnt',
      item: items[i % units.length][Math.floor(i / units.length)].id,
      n,
      ask: order[i] === 'listen' ? 'ko' : order[i],
      ...(order[i] === 'listen' && { listen: true }),
      ...(early && { early: true }),
    }));
  }

  const digit = () => pickOne(range(1, 9));
  const pickDate = (months = range(1, 12)) => {
    const m = pickOne(months);
    return { t: 'date', m, d: pickOne(range(1, DAYS_IN_MONTH[m - 1])) };
  };

  // 値段：Lv.6は1万未満。選択肢にも1万以上を出さない
  const UNDER_MAN = 10000;
  const levelSixSpecs = () => priceSpecs([
    ...distinct(3, () => digit() * 100),
    ...distinct(3, () => digit() * 1000),
    ...distinct(4, () => digit() * 1000 + digit() * 100),
  ], UNDER_MAN);

  const levelNineSpecs = () => priceSpecs([
    ...distinct(3, () => digit() * 10000),
    ...distinct(5, () => digit() * 10000 + digit() * 1000),
    ...distinct(2, () => digit() * 10000 + digit() * 1000 + digit() * 100),
  ]);

  // 日付：形が変わる6月と10月は毎回出す
  const levelSevenSpecs = () => [
    ...distinct(8, () => pickDate(range(1, 12).filter(m => m !== 6 && m !== 10))),
    pickDate([6]),
    pickDate([10]),
  ];

  // 使い分け：個数は固有数詞、値段と日付は漢数詞
  function levelTenSpecs() {
    const counts = [...sample(range(1, 10), 2), ...sample(range(11, 99), 2)];
    const prices = [digit() * 1000, digit() * 1000 + digit() * 100, digit() * 10000 + digit() * 1000];
    return someListening([
      ...countSpecs(counts, ['ko', 'ko', 'ko', 'ko']),
      ...priceSpecs(prices),
      ...distinct(3, pickDate),
    ], 3);
  }

  // 時刻：形が変わる1〜4時と11時、12時を6つ、ほかを4つ。切りのいい時間、分のある時間、半を混ぜる
  function levelElevenSpecs() {
    const hours = shuffle([...sample([1, 2, 3, 4, 11, 12], 6), ...sample(range(5, 10), 4)]);
    const minutes = sample(range(5, 55, 5), 4);
    return halfListening(hours.map((h, i) => {
      if (i < 4) return { t: 'time', h };
      if (i < 8) return { t: 'time', h, m: minutes[i - 4] };
      return { t: 'time', h, m: 30, half: true };
    }));
  }

  // 年齢を3問、新しい数え方を7問。스무 살 は毎回出す
  function levelTwelveSpecs() {
    const ages = [20, pickOne(range(11, 19)), pickOne(range(21, 49).filter(n => n % 10))].map(n => ({ t: 'age', n }));
    const numbers = shuffle([1, 2, 3, 4, ...sample(range(5, 10), 3)]);
    const counts = countSpecs(numbers, ['ko', 'ko', 'unit', 'unit', 'ja', 'listen', 'listen'], false, MORE_UNITS, MORE_ITEMS);
    return spaced([...someListening(ages, 1), ...counts]);
  }

  // 〜です：パッチムのある名詞とない名詞を3つずつ、数の言い方を4つ
  function levelThirteenSpecs() {
    const nouns = NOUNS.map(noun => noun.id);
    const [withFinal, withoutFinal] = [nouns.slice(0, 7), nouns.slice(7)];
    const someItem = pickOne(ITEMS);
    const specs = [
      ...sample(withFinal, 3).map(noun => ({ t: 'be', noun })),
      ...sample(withoutFinal, 3).map(noun => ({ t: 'be', noun })),
      { t: 'be', hour: pickOne(range(1, 12)) },
      { t: 'be', age: pickOne([20, 21, 22, 25, 30]) },
      { t: 'be', won: digit() * 1000 },
      { t: 'be', item: someItem.id, n: pickOne(range(1, 5)) },
    ];
    const asks = shuffle(['blank', 'blank', 'blank', 'make', 'make', 'make', 'listen', 'listen', 'listen', 'listen']);
    return specs.map((spec, i) => (asks[i] === 'listen' ? { ...spec, ask: 'make', listen: true } : { ...spec, ask: asks[i] }));
  }

  const pickLine = (verb, form, ask, extra) => ({
    t: 'line', verb, item: pickOne(LINE_ITEMS[verb]), n: pickOne(range(1, 5)), form, ask, ...extra,
  });

  // 動詞のレベルの1回分。単語の形を6問、数や時刻と組み合わせた文を4問。forms を交互に出す
  function verbRoundSpecs(forms) {
    const formAt = i => forms[i % forms.length];
    const words = sample(VERBS, 6).map((verb, i) => ({
      t: 'verb', id: verb.id, form: formAt(i), ask: i === 3 ? 'read' : 'make', ...(i > 3 && { listen: true }),
    }));
    const lines = sample(Object.keys(LINE_ITEMS), 3).map((verb, i) =>
      pickLine(verb, formAt(i), ['blank', 'whole', 'whole'][i], i === 2 ? { listen: true } : undefined));
    const clock = {
      t: 'clock', h: pickOne(range(1, 12)), verb: pickOne(CLOCK_VERBS),
      form: forms.find(form => form !== 'neg'), // 「3時に行きません」は不自然なので、否定は時刻の文にしない
    };
    return shuffle([...words, ...lines, clock]);
  }

  // 形が変わる言葉：ㅂ が3問、ㄹ が消える形が3問、そのほかが4問
  function levelEighteenSpecs() {
    const specs = [
      ...sample(['cold', 'hot', 'spicy', 'easy', 'hard'], 3).map(id => ({ t: 'verb', id, form: 'present' })),
      ...['live', 'make', 'know'].map(id => ({ t: 'verb', id, form: 'formal' })),
      { t: 'verb', id: pickOne(['live', 'make', 'know']), form: 'present' },
      { t: 'verb', id: 'unknown', form: 'present' },
      { t: 'verb', id: 'hear', form: 'present' },
      { t: 'verb', id: pickOne(['busy', 'hurt']), form: 'present' },
    ];
    const asks = shuffle(['make', 'make', 'make', 'make', 'make', 'make', 'read', 'listen', 'listen', 'listen']);
    return specs.map((spec, i) => (asks[i] === 'listen' ? { ...spec, listen: true } : { ...spec, ask: asks[i] }));
  }

  // 会話：10種類の質問を1回ずつ
  function levelNineteenSpecs() {
    const line = verb => {
      const { item, n } = pickLine(verb);
      return { verb, item, n };
    };
    const [did, plan, want] = sample(Object.keys(LINE_ITEMS), 3).map(line);
    const noVerb = pickOne(['drink', 'eat']);
    return someListening([
      { t: 'talk', id: 'hour', n: pickOne(range(1, 12)) },
      { t: 'talk', id: 'age', n: pickOne([19, 20, 21, 22, 25, 30, 34]) },
      { t: 'talk', id: 'people', n: pickOne(range(1, 5)) },
      { t: 'talk', id: 'price', n: digit() * 1000 + digit() * 100 },
      { t: 'talk', id: 'did', ...did },
      { t: 'talk', id: 'plan', ...plan },
      { t: 'talk', id: 'want', ...want },
      { t: 'talk', id: 'no', verb: noVerb, item: pickOne(LINE_ITEMS[noVerb]) },
      { t: 'talk', id: 'weather', word: pickOne(['cold', 'hot']) },
      { t: 'talk', id: 'sleep', n: pickOne([9, 10, 11, 12]) },
    ], 4);
  }

  // 買い物かご。limit を渡すと、合計がそれ未満のかごだけを選ぶ
  function pickCart(limit = Infinity) {
    for (;;) {
      const cart = sample(GOODS, pickOne([2, 2, 3])).map(good => [good.id, pickOne([1, 1, 2, 3])]);
      if (cart.reduce((sum, [id, qty]) => sum + goodById(id).price * qty, 0) < limit) return cart;
    }
  }

  const orderOf = cart => ({ t: 'buy', good: cart[0][0], n: cart[0][1] });

  // コンビニ1：値段はまだ習っていないので、個数で注文するところまで
  function shopOneSpecs() {
    const orders = sample(GOODS, 7).map(good => ({ t: 'buy', good: good.id, n: pickOne(range(1, 5)), early: true }));
    const bags = [1, 2, 3].map(n => ({ t: 'bag', n, early: true }));
    return someListening([...orders, ...bags], 3);
  }

  // コンビニ2：1万ウォン未満の買い物で、値段と合計を言う
  function shopTwoSpecs() {
    const carts = distinct(5, () => pickCart(UNDER_MAN));
    const total = cart => ({ t: 'total', cart, max: UNDER_MAN });
    const heard = cart => ({ ...total(cart), listen: true });
    return [
      orderOf(carts[0]), { t: 'phrase', id: 'total' }, total(carts[0]),
      orderOf(carts[1]), total(carts[1]), ...priceSpecs([pickOne(GOODS).price], UNDER_MAN),
      orderOf(carts[2]), total(carts[2]), heard(carts[3]), heard(carts[4]),
    ];
  }

  // コンビニ3：3回の買い物。注文 → 合計 → 袋 → 支払い の流れで、回ごとに少し変える
  function shopThreeSpecs() {
    const carts = [pickCart(), pickCart(), pickCart()];
    const bags = shuffle([{ t: 'bag', n: 1 }, { t: 'bag', n: 2 }, { t: 'bag', n: 3 }, { t: 'phrase', id: 'noBag' }]);
    const closing = sample(['card', 'cash', 'receipt', 'chopsticks', 'total', 'heat'], 3).map(id => ({ t: 'phrase', id }));
    const total = cart => ({ t: 'total', cart });
    return [
      orderOf(carts[0]), total(carts[0]), closing[0],
      total(carts[1]), bags[0], closing[1],
      orderOf(carts[2]), total(carts[2]), bags[1], closing[2],
    ];
  }

  // コンビニ4：数える言葉で注文して、閉店の時間を聞く
  function shopFourSpecs() {
    const orders = sample(['coffee', 'tea', 'juice', 'beer', 'soju', 'water', 'magazine'], 6)
      .map(item => ({ t: 'order', item, n: pickOne(range(1, 5)) }));
    const [late, later] = sample(range(8, 12), 2);
    return [
      ...someListening(orders, 2),
      { t: 'phrase', id: 'closing' },
      { t: 'hours', h: late },
      { t: 'hours', h: later, listen: true },
      { t: 'phrase', id: 'toilet' },
    ];
  }

  // コンビニ5：買ったものを、今と過去の形で話す
  function shopFiveSpecs() {
    const [one, two] = sample(['beer', 'bread', 'book', 'magazine'], 2);
    const bought = (item, ask, extra) => ({ ...pickLine('buy', 'past', ask, extra), item });
    return [
      { t: 'phrase', id: 'thisOne' },
      { t: 'phrase', id: 'howMuch' },
      bought(one, 'blank'),
      bought(two, 'whole'),
      { t: 'be', won: digit() * 1000, ask: 'make' },
      { t: 'be', won: digit() * 1000 + digit() * 100, ask: 'make', listen: true },
      pickLine('drink', 'present', 'whole'),
      pickLine('eat', 'past', 'whole'),
      pickLine('drink', 'past', 'blank', { listen: true }),
      pickLine('eat', 'present', 'blank', { listen: true }),
    ];
  }

  // コンビニ6：店員さんの言葉を聞き取り、したいこと、しないことを話す

    const lines = sample(Object.keys(STAFF), 4).map((id, i) => ({ t: 'staff', id, ...(i < 3 && { listen: true }) }));

      { t: 'verb', id: 'spicy', form: 'present', ask: 'make' },

  }

      cards: [...formCards(['go', 'eat', 'see'], 'want'), ...formCards(['go', 'eat', 'see'], 'plan')],

      note: 'ㅂで終わる言葉は、ㅂが워に変わります（춥다は추워요）。ㄹで終わる言葉は、ㅂ니다の前でㄹが消えます（살다は삽니다）。ほかに、모르다は몰라요、듣다は들어요、바쁘다は바빠요と変わります。',

      cards: Object.values(STAFF).map(line => [line.ja, line.ko]),
